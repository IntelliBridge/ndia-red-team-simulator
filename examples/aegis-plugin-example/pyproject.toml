[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-plugin-example"
version = "0.1.0"
description = "Reference community scanner adapter for the Aegis marketplace"
readme = "README.md"
requires-python = ">=3.12"
# No hard dependency on `aegis` itself: the adapter only references Aegis
# types lazily inside scan(), so it stays installable and importable standalone.
dependencies = []

# This is the seam the marketplace discovers. Installing this package makes
# `aegis plugins list` (with AEGIS_PLUGINS=1) surface the `example` scanner,
# and the scanner registry's eager loader will register it.
[project.entry-points."aegis.scanners"]
example = "aegis_plugin_example:create_scanner"

[tool.setuptools]
packages = ["aegis_plugin_example"]
