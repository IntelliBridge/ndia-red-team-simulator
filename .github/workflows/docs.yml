name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "hooks/**"
      - "pyproject.toml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "hooks/**"
      - "pyproject.toml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

# GitHub Pages deploys only one workflow run at a time; queue the
# rest so we don't fight ourselves.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install docs extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  # Pages publishing is OFF (the plan only offers public Pages and the repo is private).
  # To turn it on: enable Pages (source: GitHub Actions) and set repo variable ENABLE_PAGES=true.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    # Per-job perms for the Pages deploy.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
