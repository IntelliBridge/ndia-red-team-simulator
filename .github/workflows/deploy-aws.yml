name: Deploy to AWS

# CI/CD for the redsim adversarial-ML simulator. Builds three images from
# the repo root and pushes them to ECR under ndia-red-team/<name>:
#   api     deploy/Dockerfile.api     redsim FastAPI + alembic migrations
#   worker  deploy/Dockerfile.worker  Celery worker with the ml extra
#                                     (torch/ART/SHAP), runs the attacks
#   web     deploy/Dockerfile.web     Next.js @redsim/web
#
# Auth uses GitHub OIDC — no long-lived AWS keys live in GitHub. The
# workflow assumes an IAM role scoped to this repo (created out-of-band).
# Config comes from repo variables (Settings -> Variables), NOT secrets,
# because none of these values are sensitive:
#   AWS_ACCOUNT_ID       140381642432
#   AWS_REGION           us-east-1
#   AWS_DEPLOY_ROLE_ARN  arn:aws:iam::140381642432:role/ndia-red-team-gha-deploy
#   ECR_REGISTRY         140381642432.dkr.ecr.us-east-1.amazonaws.com
# The deploy job stays dormant until the ECS variables below are set:
#   ECS_CLUSTER, ECS_SERVICE_API, ECS_SERVICE_WORKER, ECS_SERVICE_WEB
# Each ECS_SERVICE_* is optional on its own: an unset one is skipped, so a
# cluster that runs only api + web (no worker service yet) still deploys.

on:
  push:
    branches: [main]
    paths:
      - "redsim/**"
      - "web/**"
      - "packages/**"
      - "deploy/Dockerfile.*"
      - "deploy/docker-compose.yml"
      - "deploy/runtime/identity/**"
      - "pyproject.toml"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for OIDC

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/Dockerfile.api
          - name: worker
            dockerfile: deploy/Dockerfile.worker
          - name: web
            dockerfile: deploy/Dockerfile.web
          - name: identity
            dockerfile: deploy/Dockerfile.identity
    steps:
      # Next.js bakes NEXT_PUBLIC_REDSIM_API_URL into the browser bundle at
      # build time, so a missing or non-https value would ship a web image
      # that points every visitor's browser at the wrong API origin. Fail
      # before assuming the AWS role rather than publishing such an image.
      - name: Require an https NEXT_PUBLIC_REDSIM_API_URL for the web image
        if: matrix.name == 'web'
        env:
          NEXT_PUBLIC_REDSIM_API_URL: ${{ vars.NEXT_PUBLIC_REDSIM_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "$NEXT_PUBLIC_REDSIM_API_URL" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_REDSIM_API_URL is not set. Set it (Settings -> Variables) to the public https:// origin of the API before building the web image." >&2
            exit 1
          fi
          case "$NEXT_PUBLIC_REDSIM_API_URL" in
            https://localhost*|https://127.*|https://\[::1\]*)
              echo "::error::NEXT_PUBLIC_REDSIM_API_URL points at a loopback host ($NEXT_PUBLIC_REDSIM_API_URL); browsers would call their own machine instead of the deployed API." >&2
              exit 1 ;;
            https://?*) ;;
            *)
              echo "::error::NEXT_PUBLIC_REDSIM_API_URL must be an https:// URL, got '$NEXT_PUBLIC_REDSIM_API_URL'." >&2
              exit 1 ;;
          esac
          echo "NEXT_PUBLIC_REDSIM_API_URL=$NEXT_PUBLIC_REDSIM_API_URL"

      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            NEXT_PUBLIC_REDSIM_API_URL=${{ vars.NEXT_PUBLIC_REDSIM_API_URL }}
          tags: |
            ${{ vars.ECR_REGISTRY }}/ndia-red-team/${{ matrix.name }}:${{ github.sha }}
            ${{ vars.ECR_REGISTRY }}/ndia-red-team/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # Single-host EC2 runtime (2026-09-09): one SSM command on the instance
  # named by the repository variable EC2_INSTANCE_ID installs this commit's
  # deploy/ec2/redsim-render-env.sh and redsim-roll.sh as the host scripts,
  # then runs redsim-roll <sha>: re-render the environment from Secrets
  # Manager (so a new or rotated secret, Pythia included, lands on the next
  # deploy), repair the compose env_file lists of an older bootstrap, pull
  # the four images of this commit from ECR and recreate the containers.
  # Fast (about two minutes after the images exist) and reliable: the job
  # waits for the command's exit code, fails on non-zero, then requires
  # /health to answer 200 on the public hostname. No SSH keys in CI: the
  # deploy role holds ssm:SendCommand on this one instance.
  deploy-ec2:
    needs: build-and-push
    if: ${{ vars.EC2_INSTANCE_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Roll the host to this commit's images
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Ship the host scripts of this commit inline (base64, no quoting hazards),
          # then roll. Both files are a few KB, far under the SSM parameter limit.
          render_b64="$(base64 -w0 deploy/ec2/redsim-render-env.sh)"
          roll_b64="$(base64 -w0 deploy/ec2/redsim-roll.sh)"
          params="$(jq -cn --arg r "$render_b64" --arg l "$roll_b64" --arg sha "$SHA" '{commands: [
            "echo \($r) | base64 -d | sudo tee /usr/local/bin/redsim-render-env >/dev/null && sudo chmod 0755 /usr/local/bin/redsim-render-env",
            "echo \($l) | base64 -d | sudo tee /usr/local/bin/redsim-roll >/dev/null && sudo chmod 0755 /usr/local/bin/redsim-roll",
            "sudo /usr/local/bin/redsim-roll \($sha)"
          ]}')"
          cmd_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --timeout-seconds 900 \
            --comment "redsim roll $SHA" \
            --parameters "$params" \
            --query Command.CommandId --output text)"
          echo "SSM command $cmd_id"
          for _ in $(seq 1 90); do
            status="$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success) break ;;
              Pending|InProgress|Delayed) sleep 10 ;;
              *) echo "::error::roll ended with status $status" >&2
                 aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query '[StandardOutputContent,StandardErrorContent]' --output text | tail -n 60
                 exit 1 ;;
            esac
          done
          [ "$status" = "Success" ] || { echo "::error::roll did not finish in time (status $status)" >&2; exit 1; }
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text | tail -n 20
      - name: Require the public health check
        env:
          URL: ${{ vars.NEXT_PUBLIC_REDSIM_API_URL }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$URL/health" || true)"
            [ "$code" = "200" ] && { echo "$URL/health 200"; exit 0; }
            sleep 10
          done
          echo "::error::$URL/health did not answer 200 after the roll (last: $code)" >&2
          exit 1

  deploy:
    # The ECS runtime was retired on 2026-09-09 in favour of the EC2 host
    # above; this job stays skipped while ECS_CLUSTER is unset.
    needs: build-and-push
    if: ${{ vars.ECS_CLUSTER != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Roll ECS services to the new image
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE_API: ${{ vars.ECS_SERVICE_API }}
          ECS_SERVICE_WORKER: ${{ vars.ECS_SERVICE_WORKER }}
          ECS_SERVICE_WEB: ${{ vars.ECS_SERVICE_WEB }}
        run: |
          set -euo pipefail
          # Guard: the job condition only checks ECS_CLUSTER, so fail loudly
          # if no service is configured rather than reporting a false-positive
          # green deploy that rolled nothing.
          if [ -z "$ECS_SERVICE_API" ] && [ -z "$ECS_SERVICE_WORKER" ] && [ -z "$ECS_SERVICE_WEB" ]; then
            echo "::error::ECS_CLUSTER is set but none of ECS_SERVICE_API, ECS_SERVICE_WORKER, ECS_SERVICE_WEB is configured; nothing to deploy." >&2
            exit 1
          fi
          for svc in "$ECS_SERVICE_API" "$ECS_SERVICE_WORKER" "$ECS_SERVICE_WEB"; do
            [ -n "$svc" ] || continue
            echo "Forcing new deployment for $svc"
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$svc" \
              --force-new-deployment >/dev/null
          done
          echo "Waiting for services to stabilize..."
          for svc in "$ECS_SERVICE_API" "$ECS_SERVICE_WORKER" "$ECS_SERVICE_WEB"; do
            [ -n "$svc" ] || continue
            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" --services "$svc"
          done
