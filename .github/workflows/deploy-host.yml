name: Deploy to the EC2 host

# Every push to main deploys from source on the host: one SSM command runs
# redsim-deploy, which fast-forwards the checkout and restarts the containers
# that bind-mount it. No image build, no registry. About one minute.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (default main)"
        default: main
      build:
        description: "Rebuild the dependency images on the host"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-host
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.EC2_INSTANCE_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy on the host over SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          REF: ${{ github.event.inputs.ref || 'main' }}
          BUILD: ${{ github.event.inputs.build == 'true' && '--build' || '' }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The ref is a dispatch input; only a git-ref character set reaches the host command.
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::invalid ref '$REF'" >&2; exit 1; }
          cmd_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --timeout-seconds 900 \
            --comment "redsim deploy $SHA" \
            --parameters "commands=[\"sudo /usr/local/bin/redsim-deploy $REF $BUILD\"]" \
            --query Command.CommandId --output text)"
          echo "SSM command $cmd_id"
          status=Pending
          for _ in $(seq 1 90); do
            status="$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success) break ;;
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text | tail -n 40
          [ "$status" = "Success" ] || { echo "::error::deploy ended with status $status" >&2; exit 1; }
