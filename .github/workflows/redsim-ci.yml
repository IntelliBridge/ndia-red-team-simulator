name: Redsim CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the fixture-assisted E2E + stack E2E jobs"
        type: boolean
        default: false

jobs:
  unit:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        # The ml extra (torch/torchvision/ART/SHAP/onnxruntime) is installed
        # and exercised on 3.12 only: it is the interpreter the ml stack is
        # validated on (the deploy images moved to python:3.14-slim with the
        # dependabot docker bump #13 and install no ml extra in the api image),
        # and it keeps the 3.13 lane a fast pure-platform check. 3.13 deselects
        # the ``ml``-marked tests instead (ml test modules must
        # ``pytest.importorskip`` their heavy imports so collection also
        # survives without the extra, and redsim.ml modules must import without
        # torch: tests/ml/test_import_order.py). See docs/dev/ci.md.
        # ``not garak`` restates the addopts exclusion: garak-marked tests run
        # only in the ``garak offline`` job, which installs that extra.
        include:
          - python-version: "3.12"
            install-ml: true
            markers: "not integration and not docker and not e2e and not slow and not auth_required and not garak"
          - python-version: "3.13"
            install-ml: false
            markers: "not integration and not docker and not e2e and not slow and not auth_required and not ml and not garak"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Redsim (api, worker, test, dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,worker,test,dev]"

      # CPU-only torch/torchvision first (the deploy/Dockerfile.worker pattern)
      # so the ml extra reuses them instead of pulling the multi-GB CUDA wheels.
      - name: Install the ml extra (py3.12 only, CPU torch)
        if: matrix.install-ml
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3" "torchvision>=0.18"
          python -m pip install -e ".[ml]"

      # ruff >= 0.16 enables a much larger default rule set (413 rules) than
      # the E4/E7/E9/F default this tree was written against, and
      # pyproject.toml only says ``extend-select = ["I"]``. Select the intended
      # set explicitly until pyproject.toml pins ``lint.select`` itself
      # (see docs/dev/ci.md).
      - name: Lint (ruff)
        run: ruff check --select E4,E7,E9,F,I redsim tests

      - name: Type-check (mypy)
        run: mypy redsim

      # Pure-unit fast lane: no Postgres/Redis service here, so the DB-backed
      # tests (stamped ``integration`` by tests/conftest.py) are deselected and
      # run in the Postgres-equipped ``coverage`` / ``api-integration`` jobs
      # instead. A CLI ``-m`` overrides ``addopts``, so the
      # docker/e2e/slow/auth_required exclusions are restated in the matrix
      # ``markers`` expression alongside ``not integration`` (and ``not ml``
      # on the interpreter without the extra).
      - name: Run unit tests (no integration)
        run: >-
          pytest -q
          -m "${{ matrix.markers }}"
          --cov=redsim --cov-report=term-missing

  # The dedicated ML tier (remaining-work brief B2): the ``ml``-marked tests
  # alone, offline, on the interpreter the ml stack is validated on. The
  # unit py3.12 lane still installs the extra and runs the default tier, so
  # this job adds a check that fails only on the ml stack, and it caches the
  # CPU torch wheels: ``pip index versions`` reads the version from the CPU
  # index (metadata only), the cache key carries it, and the wheels are
  # downloaded only on a miss and installed from the cache directory with
  # ``--no-index``. The api and worker extras are installed as well because
  # the ml-marked route and worker tests build the app and the Celery tasks.
  ml-tier:
    name: ML tier (py3.12, ml extra)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TORCH_CPU_INDEX: https://download.pytorch.org/whl/cpu
      TORCH_WHEELS: ${{ github.workspace }}/.torch-wheels
      # Offline: no hub, no dataset fetch, no gateway. A test that reaches
      # for the network fails loudly here.
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      REDSIM_DISABLE_LLM: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install Redsim (api, worker, test, dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,worker,test,dev]"
      - name: Resolve the CPU torch version (cache key)
        id: torch
        run: |
          v="$(python -m pip index versions torch --index-url "$TORCH_CPU_INDEX" 2>/dev/null | head -n 1 | sed -E 's/.*\((.*)\).*/\1/')"
          if [ -z "$v" ]; then v="unresolved-$(sha256sum pyproject.toml | cut -c1-12)"; fi
          echo "torch version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Restore the CPU torch wheels
        id: torch-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TORCH_WHEELS }}
          key: ml-tier-${{ runner.os }}-py3.12-torch-${{ steps.torch.outputs.version }}
      - name: Download the CPU torch wheels (cache miss only)
        if: steps.torch-cache.outputs.cache-hit != 'true'
        run: >-
          python -m pip download --dest "$TORCH_WHEELS"
          --index-url "$TORCH_CPU_INDEX" "torch>=2.3" "torchvision>=0.18"
      - name: Install torch and torchvision from the cached wheels
        run: python -m pip install --no-index --find-links "$TORCH_WHEELS" torch torchvision
      - name: Install the ml extra
        run: python -m pip install -e ".[ml]"
      - name: ML tier (-m ml, offline)
        run: >-
          pytest -q -p no:cacheprovider -m ml tests
          --durations=15

  no-leaked-artifacts:
    name: redsim_output is not committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if redsim_output is tracked
        run: |
          if git ls-files --error-unmatch redsim_output 2>/dev/null; then
            echo "::error::redsim_output/ is tracked in git; add to .gitignore and untrack"
            exit 1
          fi

  secret-scan:
    name: Secret scan (trufflehog, verified only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install trufflehog
        run: curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Scan filesystem (verified secrets only)
        run: trufflehog filesystem . --only-verified --fail --no-update

  otel-config:
    name: OTel Collector config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate deploy/otel/config.yaml
        run: |
          python - <<'PY'
          import sys
          import yaml

          with open("deploy/otel/config.yaml") as fh:
              cfg = yaml.safe_load(fh)

          sections = ("receivers", "processors", "exporters")
          defined = {s: set((cfg.get(s) or {}).keys()) for s in sections}
          errors = []

          pipelines = ((cfg.get("service") or {}).get("pipelines")) or {}
          if not pipelines:
              errors.append("no service.pipelines defined")
          for name, spec in pipelines.items():
              spec = spec or {}
              for s in sections:
                  for comp in (spec.get(s) or []):
                      if comp not in defined[s]:
                          errors.append(
                              f"pipeline {name!r}: {s} {comp!r} is referenced but not defined"
                          )

          # Forward-looking components (osquery receiver, isolationforest
          # processor) are NOT standard collector-contrib parts; an active
          # reference would fail Collector startup. They must stay commented.
          for s, comp in (("receivers", "osquery"), ("processors", "isolationforest")):
              if comp in defined[s]:
                  errors.append(
                      f"{comp!r} must stay commented-out (no standard contrib build ships it)"
                  )

          if errors:
              print("::error::OTel Collector config validation failed")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)

          print(
              f"OTel config OK: {len(pipelines)} pipelines; "
              f"{len(defined['receivers'])} receivers, "
              f"{len(defined['processors'])} processors, "
              f"{len(defined['exporters'])} exporters"
          )
          PY

  helm-lint:
    name: Helm chart lints + templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.15.4"
      - name: helm lint
        run: helm lint deploy/helm/redsim
      # Templating with default values must succeed (renders every manifest).
      - name: helm template (default values)
        run: helm template redsim deploy/helm/redsim > /dev/null
      # And again with the sandbox + ingress toggles on, so the gated
      # RuntimeClass / Ingress paths are exercised too.
      - name: helm template (sandbox + ingress enabled)
        run: |
          helm template redsim deploy/helm/redsim \
            --set sandbox.enabled=true \
            --set ingress.enabled=true > /dev/null
      # Prod-secret guard (C8): a prod deployment that left the dev secret
      # placeholders in place with no external secret wired MUST be rejected.
      # Assert both the non-zero exit AND the actionable guard message.
      - name: helm template (prod + dev placeholders) fails the guard
        run: |
          out="$(helm template redsim deploy/helm/redsim \
            -f deploy/helm/redsim/ci/prod-placeholders-values.yaml 2>&1)" && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::prod-secret guard did NOT fire: render succeeded with dev placeholders in prod"
            exit 1
          fi
          echo "$out" | grep -q "shipped DEV placeholders" || {
            echo "::error::render failed but not via the prod-secret guard (unexpected error)"; exit 1; }
          echo "prod-secret guard fired as expected"
      # The same prod deployment is accepted once the External Secrets Operator
      # is wired in, and renders an ExternalSecret (not an inline Secret).
      - name: helm template (prod + externalSecrets) renders an ExternalSecret
        run: |
          out="$(helm template redsim deploy/helm/redsim \
            -f deploy/helm/redsim/ci/prod-externalsecrets-values.yaml)"
          echo "$out" | grep -q "kind: ExternalSecret" || {
            echo "::error::ExternalSecret was not rendered when externalSecrets.enabled=true"; exit 1; }
          echo "ExternalSecret rendered as expected"
      # The same guard rejects a prod deployment that supplied every other
      # secret but left the API session keypair empty. That one renders and
      # installs today, then answers 401 to every call after a successful
      # login, so the render is the only place it can be caught.
      - name: helm template (prod + empty api session keys) fails the guard
        run: |
          out="$(helm template redsim deploy/helm/redsim \
            -f deploy/helm/redsim/ci/prod-api-session-keys-values.yaml 2>&1)" && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::prod-secret guard did NOT fire: render succeeded with an empty API session keypair"
            exit 1
          fi
          for half in apiSessionPrivateKey apiSessionPublicKey; do
            echo "$out" | grep -q "config.secret.$half" || {
              echo "::error::render failed but did not name config.secret.$half (unexpected error)"; exit 1; }
          done
          echo "prod-secret guard fired as expected"
      # A prod deployment with secrets overridden by real values renders cleanly.
      - name: helm template (prod + real secrets) succeeds
        run: |
          helm template redsim deploy/helm/redsim \
            --set config.env=prod \
            --set config.secret.s3AccessKeyId=ci-real-access-key \
            --set config.secret.s3SecretAccessKey=ci-real-secret-key \
            --set config.secret.betterAuthSecret=ci-real-better-auth-secret-0123456789 \
            --set-string config.secret.apiSessionPrivateKey=ci-not-a-real-key \
            --set-string config.secret.apiSessionPublicKey=ci-not-a-real-key > /dev/null

  sast:
    name: SAST (semgrep + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Redsim (security extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[security]"
      # semgrep p/python + p/security-audit at ERROR only: high-signal
      # rules so the gate stays low-noise. --error makes a finding fail the
      # job; .semgrep.yml adds our repo-specific bans (shell=True, yaml.load,
      # eval/exec) on top of the registry packs. Registry packs are fetched
      # from semgrep.dev at run time (no auth/token required for these packs).
      - name: Semgrep (p/python + p/security-audit, ERROR)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep --config p/python \
                  --config p/security-audit \
                  --config .semgrep.yml \
                  --severity ERROR \
                  --error \
                  --metrics off \
                  redsim
      # bandit -ll -ii => report MEDIUM+ severity AND MEDIUM+ confidence
      # (a non-zero exit fails the job). --ini .bandit carries the documented
      # baseline skips (see .bandit and SECURITY.md). bandit does NOT
      # auto-discover .bandit, so the path is passed explicitly.
      - name: Bandit (-ll -ii, high-confidence)
        run: bandit -r redsim -ll -ii --ini .bandit

  deps:
    name: Dependency CVEs (pip-audit + trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Audit the *resolved* runtime env (api + worker), not just the lean
      # base, so transitive CVEs in the deployed deps are caught. The
      # `security` extra brings pip-audit itself.
      - name: Install Redsim (resolved runtime + security extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,worker,security]"
      # --skip-editable drops the local redsim-platform editable (not on PyPI,
      # so it has no advisory record). Un-fixable transitive CVE IDs go in
      # .github/pip-audit-ignores.txt (documented baseline, seeded empty);
      # each line that is not blank / a comment becomes one --ignore-vuln.
      - name: pip-audit (resolved env)
        run: |
          ignores=()
          while IFS= read -r line; do
            line="${line%%#*}"
            line="$(echo "$line" | xargs)"
            [ -n "$line" ] && ignores+=(--ignore-vuln "$line")
          done < .github/pip-audit-ignores.txt
          # NB: no --strict here — it is incompatible with the deliberate
          # --skip-editable (it would treat the intentionally-skipped local
          # redsim-platform editable as a collection failure and always fail).
          pip-audit --skip-editable "${ignores[@]}"
      # trivy fs over the whole repo: HIGH,CRITICAL only, and exit 1 on a hit so
      # the job gates. .trivyignore carries the documented baseline of
      # advisories we cannot take yet (each with its reason). We install the
      # trivy binary directly (same curl|sh pattern as the trufflehog job)
      # rather than via aquasecurity/trivy-action: that action's pinned
      # releases reference an internal aquasecurity/setup-trivy tag that
      # upstream has removed, which fails action resolution at job-setup. A
      # direct install has no such transitive-tag dependency. The release is
      # pinned so a scanner behaviour change cannot flip the gate on its own;
      # dependabot cannot bump a curl'd binary, so bump TRIVY_VERSION by hand
      # (https://github.com/aquasecurity/trivy/releases).
      - name: Install Trivy
        env:
          TRIVY_VERSION: v0.74.0
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin "$TRIVY_VERSION"
          trivy --version
      - name: Trivy filesystem scan (HIGH,CRITICAL)
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        run: |
          # --scanners vuln: this job is the dependency-CVE gate; secret
          # scanning is the trufflehog job's responsibility.
          # --skip-dirs redsim-designs: a v0.dev design export kept for
          # reference only (see redsim-designs/README.md). It is not a
          # pnpm workspace member, is not built, tested or shipped, and
          # carries its own pinned lockfile we do not intend to baseline
          # advisories for; it is slated for removal once the redesign
          # work it references is done.
          trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --ignorefile .trivyignore --skip-dirs redsim-designs \
            --no-progress .

  coverage:
    # Stable name on purpose: the threshold below moves, the check name should
    # not (branch protection keys on it).
    name: Coverage gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: redsim
          POSTGRES_PASSWORD: redsim
          POSTGRES_DB: redsim
        options: >-
          --health-cmd "pg_isready -U redsim"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    env:
      REDSIM_DB_URL: postgresql+psycopg://redsim:redsim@localhost:5432/redsim
      REDSIM_BROKER_URL: redis://localhost:6379/0
      REDSIM_RESULT_BACKEND: redis://localhost:6379/1
      # Truthful floor, not the target. Measured on 2026-09-08 after the
      # pentest removal + redsim rename: 83% locally (SQLite only, 28
      # integration tests skipped), 86.26% in this job on main, 84.70% on
      # feat/ml-core. Floor = local measurement minus 2, rounded down. The
      # target returns to 90 as the ML vertical lands; raise this in step with
      # each merged phase (see docs/dev/ci.md, "Coverage gate").
      COV_FAIL_UNDER: "81"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Redsim (api, worker, test, dev + ml with CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,worker,test,dev]"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3" "torchvision>=0.18"
          python -m pip install -e ".[ml]"
      - name: Migrate
        run: alembic upgrade head
      - name: Coverage gate
        run: |
          echo "coverage floor: ${COV_FAIL_UNDER}% (target 90, see docs/dev/ci.md)"
          pytest -q --cov=redsim --cov-report=term-missing --cov-fail-under="${COV_FAIL_UNDER}"

  api-integration:
    name: API integration (Postgres + Redis)
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: redsim
          POSTGRES_PASSWORD: redsim
          POSTGRES_DB: redsim
        options: >-
          --health-cmd "pg_isready -U redsim"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    env:
      REDSIM_DB_URL: postgresql+psycopg://redsim:redsim@localhost:5432/redsim
      REDSIM_BROKER_URL: redis://localhost:6379/0
      REDSIM_RESULT_BACKEND: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -e ".[api,worker,test]"
      - name: Migrate
        run: alembic upgrade head
      # No ml or garak extra in this job (the ML tests run in ``unit`` py3.12 and
      # ``coverage``, the garak tests in ``garak-offline``), so ``not ml`` and
      # ``not garak`` join the restated addopts exclusions.
      - name: Integration tests
        run: pytest -q -m "not e2e and not docker and not slow and not auth_required and not ml and not garak" tests/

  web-build:
    name: Next.js build (pnpm, frozen lockfile)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      # No version input: the root package.json now declares
      # packageManager: pnpm@10.33.2, and the action aborts with "Multiple
      # versions of pnpm specified" when both are present and differ.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Matches deploy/Dockerfile.web's node:26-bookworm-slim base.
          node-version: "26"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      # Workspace lives at the repo root (v0.4.0 F16); install from
      # there so both @redsim/web and @redsim/design-system are linked.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # Flat config at the repo root, scoped to web/ with basePath.
      - name: Lint
        run: pnpm run lint
      # Design-system ships the shared component layer; its real source
      # (components + primitives + index) must type-check cleanly. Stories
      # are excluded via tsconfig.build.json (their @storybook/react types
      # live only in the web workspace), so this gate is blocking.
      - name: Typecheck design-system
        run: pnpm --filter @redsim/design-system run typecheck
      - name: Typecheck web
        run: pnpm --filter @redsim/web typecheck
      - name: Test web (vitest)
        run: pnpm --filter @redsim/web test
      - name: Build
        # No runtime environment exists in CI, and web/src/env.js validates at
        # config load. Same hatch the Docker builder stage takes.
        env:
          SKIP_ENV_VALIDATION: "1"
        run: pnpm --filter @redsim/web build

  docker-images:
    name: Build images (no push)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.api
          push: false
      - name: Build worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.worker
          push: false
      # deploy/Dockerfile.web requires the browser API origin as a build
      # argument (no localhost default). This image is never pushed, so a
      # placeholder https origin proves the build; deploy-aws.yml passes the
      # real public origin after its guard.
      - name: Build web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.web
          push: false
          build-args: |
            NEXT_PUBLIC_REDSIM_API_URL=https://redsim.ci.invalid
      - name: Build log-ingest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.log_ingest
          push: false

  # The Python end-to-end tier (tests/e2e: real API, admission, eager Celery,
  # the real sandbox child, the CLI) on every PR and push (plan 12, TESTS_DOCS-04).
  # The harness runs on a file-backed sqlite of its own and scrubs REDSIM_DB_URL
  # from the process; Postgres here serves only the RLS lane, which the tier
  # reaches through REDSIM_E2E_POSTGRES_URL after the migrate step. No network,
  # no Pythia (the harness mocks the gateway in the worker parent), no Docker.
  e2e-python:
    name: E2E tier (python, eager Celery)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: redsim
          POSTGRES_PASSWORD: redsim
          POSTGRES_DB: redsim
        options: >-
          --health-cmd "pg_isready -U redsim"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    env:
      E2E_POSTGRES_URL: postgresql+psycopg://redsim:redsim@localhost:5432/redsim
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      # Same install as the Coverage gate: CPU-only torch first so the ml extra
      # resolves against it instead of the CUDA wheels.
      - name: Install Redsim (api, worker, test, dev + ml with CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,worker,test,dev]"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3" "torchvision>=0.18"
          python -m pip install -e ".[ml]"
      # ``postgres_url`` fails (never skips) when the URL points at an unmigrated
      # database, so migrate before the tier runs.
      - name: Migrate the RLS-lane database
        env:
          REDSIM_DB_URL: ${{ env.E2E_POSTGRES_URL }}
        run: alembic upgrade head
      # ``--basetemp`` pins the harness directory (assets, sqlite file, blobs,
      # sandbox work dirs, CLI output) to a known path so it can be uploaded on
      # failure. The harness sets REDSIM_ML_WORK_DIR under it and scrubs
      # REDSIM_ML_KEEP_WORK_DIR, so the keep switch is not set here.
      - name: Python end-to-end tier
        env:
          REDSIM_E2E: "1"
          REDSIM_E2E_POSTGRES_URL: ${{ env.E2E_POSTGRES_URL }}
        run: >-
          pytest -q -p no:cacheprovider -m e2e tests/e2e
          --durations=15
          --basetemp="$RUNNER_TEMP/redsim-e2e"
      - name: Upload the harness directory (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-python-harness
          path: ${{ runner.temp }}/redsim-e2e
          if-no-files-found: ignore
          retention-days: 7

  # The garak tier (plan 12, TESTS_DOCS-02): installs the pinned garak extra on
  # top of the platform extras and runs the garak-marked tests with no gateway
  # variable in the environment, so a probe that reaches for a real endpoint
  # fails loudly. Passing with zero tests selected is acceptable while the LLM
  # tracks land their tests: pytest exits 5 in that case and the step maps it
  # to success, so the lane proves only that the extra installs and imports.
  garak-offline:
    name: garak offline
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    # garak writes its run reports and plugin cache under the XDG directories;
    # keep them inside the runner temp, never in the checkout. The ``runner``
    # context is not available in a job-level ``env`` (the B0 to B3 pushes
    # failed at workflow parse on exactly that), so the two garak steps set
    # the XDG variables in their own ``env`` blocks below.
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      # garak pulls torch and transformers; CPU-only torch first, as in the
      # other lanes, so the resolver reuses it instead of the CUDA wheels.
      - name: Install Redsim (api, worker, test, dev + garak with CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,worker,test,dev]"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[garak]"
      - name: garak extra imports
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/garak-xdg/data
          XDG_CONFIG_HOME: ${{ runner.temp }}/garak-xdg/config
          XDG_CACHE_HOME: ${{ runner.temp }}/garak-xdg/cache
        run: python -c "import garak; print('garak', garak.__version__)"
      - name: garak tier (-m garak; exit 5 = nothing selected yet)
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/garak-xdg/data
          XDG_CONFIG_HOME: ${{ runner.temp }}/garak-xdg/config
          XDG_CACHE_HOME: ${{ runner.temp }}/garak-xdg/cache
        run: |
          set +e
          pytest -q -p no:cacheprovider -m garak tests
          rc=$?
          set -e
          if [ "$rc" -eq 5 ]; then
            echo "::notice::no garak-marked tests collected yet; this lane proves the extra installs and imports, nothing more"
            exit 0
          fi
          exit "$rc"

  e2e-stack:
    name: Stack E2E (Playwright, fixture-assisted)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    needs: [api-integration, web-build]
    env:
      REDSIM_E2E_STACK: "1"
      REDSIM_DISABLE_LLM: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install Redsim
        run: pip install -e ".[api,worker,test]"
      - name: Bring stack up
        working-directory: deploy
        run: docker compose up -d --build
      - name: Playwright
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose down -v
