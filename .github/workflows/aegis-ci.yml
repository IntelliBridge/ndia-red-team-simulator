name: Aegis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the fixture-assisted E2E + stack E2E jobs"
        type: boolean
        default: false

jobs:
  unit:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Aegis
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"

      - name: Verify uv.lock is up to date
        run: |
          pip install uv
          uv lock --check || (echo "::error::uv.lock is out of sync with pyproject.toml. Run 'uv lock' and commit."; exit 1)

      - name: Lint (ruff)
        run: ruff check aegis tests

      - name: Type-check (mypy)
        run: mypy aegis

      # Pure-unit fast lane: this job installs only .[test,dev] (no api/worker
      # extras), so the DB-backed tests carry the ``integration`` marker and are
      # deselected here — they run in the Postgres-equipped ``coverage`` /
      # ``api-integration`` jobs instead. An explicit ``-m`` makes that split
      # real (previously the filter was inert: nothing was marked). A CLI ``-m``
      # overrides ``addopts``, so the docker/e2e/slow/auth_required exclusions
      # are restated here alongside ``not integration``.
      - name: Run unit tests (no integration)
        run: >-
          pytest -q
          -m "not integration and not docker and not e2e and not slow and not auth_required"
          --cov=aegis --cov-report=term-missing

  no-leaked-artifacts:
    name: aegis_output is not committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if aegis_output is tracked
        run: |
          if git ls-files --error-unmatch aegis_output 2>/dev/null; then
            echo "::error::aegis_output/ is tracked in git; add to .gitignore and untrack"
            exit 1
          fi

  submodule-integrity:
    name: Submodules pinned and clean
    runs-on: ubuntu-latest
    steps:
      # Top-level only: we vendor Strix, CAI, and mcp-kali-server. CAI carries
      # its own nested benchmark submodules pinned at commits upstream has since
      # made unfetchable, so a recursive checkout would fail on refs we don't own.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Submodules at pinned commit (no -/+/U prefix)
        run: |
          status="$(git submodule status)"
          echo "$status"
          if echo "$status" | grep -qE '^[-+U]'; then
            echo "::error::A submodule is not at its pinned commit (-/+/U prefix). Run 'git submodule update --init'."
            exit 1
          fi
      - name: Submodule working trees are clean
        run: |
          git submodule foreach '
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "::error::Submodule $name has uncommitted changes (vendored upstream must stay pristine)"; exit 1
            fi
          '

  secret-scan:
    name: Secret scan (trufflehog, verified only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install trufflehog
        run: curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Scan filesystem (verified secrets only)
        run: trufflehog filesystem . --only-verified --fail --no-update

  otel-config:
    name: OTel Collector config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate deploy/otel/config.yaml
        run: |
          python - <<'PY'
          import sys
          import yaml

          with open("deploy/otel/config.yaml") as fh:
              cfg = yaml.safe_load(fh)

          sections = ("receivers", "processors", "exporters")
          defined = {s: set((cfg.get(s) or {}).keys()) for s in sections}
          errors = []

          pipelines = ((cfg.get("service") or {}).get("pipelines")) or {}
          if not pipelines:
              errors.append("no service.pipelines defined")
          for name, spec in pipelines.items():
              spec = spec or {}
              for s in sections:
                  for comp in (spec.get(s) or []):
                      if comp not in defined[s]:
                          errors.append(
                              f"pipeline {name!r}: {s} {comp!r} is referenced but not defined"
                          )

          # Forward-looking components (osquery receiver, isolationforest
          # processor) are NOT standard collector-contrib parts; an active
          # reference would fail Collector startup. They must stay commented.
          for s, comp in (("receivers", "osquery"), ("processors", "isolationforest")):
              if comp in defined[s]:
                  errors.append(
                      f"{comp!r} must stay commented-out (no standard contrib build ships it)"
                  )

          if errors:
              print("::error::OTel Collector config validation failed")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)

          print(
              f"OTel config OK: {len(pipelines)} pipelines; "
              f"{len(defined['receivers'])} receivers, "
              f"{len(defined['processors'])} processors, "
              f"{len(defined['exporters'])} exporters"
          )
          PY

  helm-lint:
    name: Helm chart lints + templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.4"
      - name: helm lint
        run: helm lint deploy/helm/aegis
      # Templating with default values must succeed (renders every manifest).
      - name: helm template (default values)
        run: helm template aegis deploy/helm/aegis > /dev/null
      # And again with the sandbox + ingress toggles on, so the gated
      # RuntimeClass / Ingress paths are exercised too.
      - name: helm template (sandbox + ingress enabled)
        run: |
          helm template aegis deploy/helm/aegis \
            --set sandbox.enabled=true \
            --set ingress.enabled=true > /dev/null
      # Prod-secret guard (C8): a prod deployment that left the dev secret
      # placeholders in place with no external secret wired MUST be rejected.
      # Assert both the non-zero exit AND the actionable guard message.
      - name: helm template (prod + dev placeholders) fails the guard
        run: |
          out="$(helm template aegis deploy/helm/aegis \
            -f deploy/helm/aegis/ci/prod-placeholders-values.yaml 2>&1)" && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::prod-secret guard did NOT fire: render succeeded with dev placeholders in prod"
            exit 1
          fi
          echo "$out" | grep -q "shipped DEV placeholders" || {
            echo "::error::render failed but not via the prod-secret guard (unexpected error)"; exit 1; }
          echo "prod-secret guard fired as expected"
      # The same prod deployment is accepted once the External Secrets Operator
      # is wired in, and renders an ExternalSecret (not an inline Secret).
      - name: helm template (prod + externalSecrets) renders an ExternalSecret
        run: |
          out="$(helm template aegis deploy/helm/aegis \
            -f deploy/helm/aegis/ci/prod-externalsecrets-values.yaml)"
          echo "$out" | grep -q "kind: ExternalSecret" || {
            echo "::error::ExternalSecret was not rendered when externalSecrets.enabled=true"; exit 1; }
          echo "ExternalSecret rendered as expected"
      # A prod deployment with secrets overridden by real values renders cleanly.
      - name: helm template (prod + real secrets) succeeds
        run: |
          helm template aegis deploy/helm/aegis \
            --set config.env=prod \
            --set config.secret.s3AccessKeyId=ci-real-access-key \
            --set config.secret.s3SecretAccessKey=ci-real-secret-key \
            --set config.secret.nextAuthSecret=ci-real-nextauth-secret > /dev/null

  sast:
    name: SAST (semgrep + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Aegis (security extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[security]"
      # semgrep p/python + p/security-audit at ERROR only: high-signal
      # rules so the gate stays low-noise. --error makes a finding fail the
      # job; .semgrep.yml adds our repo-specific bans (shell=True, yaml.load,
      # eval/exec) on top of the registry packs. Registry packs are fetched
      # from semgrep.dev at run time (no auth/token required for these packs).
      - name: Semgrep (p/python + p/security-audit, ERROR)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep --config p/python \
                  --config p/security-audit \
                  --config .semgrep.yml \
                  --severity ERROR \
                  --error \
                  --metrics off \
                  aegis
      # bandit -ll -ii => report MEDIUM+ severity AND MEDIUM+ confidence
      # (a non-zero exit fails the job). --ini .bandit carries the documented
      # baseline skips (see .bandit and SECURITY.md). bandit does NOT
      # auto-discover .bandit, so the path is passed explicitly.
      - name: Bandit (-ll -ii, high-confidence)
        run: bandit -r aegis -ll -ii --ini .bandit

  deps:
    name: Dependency CVEs (pip-audit + trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Audit the *resolved* runtime env (api + worker), not just the lean
      # base, so transitive CVEs in the deployed deps are caught. The
      # `security` extra brings pip-audit itself.
      - name: Install Aegis (resolved runtime + security extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,worker,security]"
      # --skip-editable drops the local aegis-platform editable (not on PyPI,
      # so it has no advisory record). Un-fixable transitive CVE IDs go in
      # .github/pip-audit-ignores.txt (documented baseline, seeded empty);
      # each line that is not blank / a comment becomes one --ignore-vuln.
      - name: pip-audit (resolved env)
        run: |
          ignores=()
          while IFS= read -r line; do
            line="${line%%#*}"
            line="$(echo "$line" | xargs)"
            [ -n "$line" ] && ignores+=(--ignore-vuln "$line")
          done < .github/pip-audit-ignores.txt
          # NB: no --strict here — it is incompatible with the deliberate
          # --skip-editable (it would treat the intentionally-skipped local
          # aegis-platform editable as a collection failure and always fail).
          pip-audit --skip-editable "${ignores[@]}"
      # trivy fs over the whole repo: HIGH,CRITICAL only, and exit 1 on a hit so
      # the job gates. .trivyignore carries the documented baseline of un-fixable
      # advisories (seeded empty). We install the trivy binary directly (same
      # curl|sh pattern as the trufflehog job) rather than via
      # aquasecurity/trivy-action: that action's pinned releases reference an
      # internal aquasecurity/setup-trivy tag that upstream has removed, which
      # fails action resolution at job-setup. A direct install has no such
      # transitive-tag dependency.
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
      - name: Trivy filesystem scan (HIGH,CRITICAL)
        run: |
          trivy fs --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile .trivyignore --no-progress .

  coverage:
    name: Coverage (>=90%)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    env:
      AEGIS_DB_URL: postgresql+psycopg://aegis:aegis@localhost:5432/aegis
      AEGIS_BROKER_URL: redis://localhost:6379/0
      AEGIS_RESULT_BACKEND: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Aegis
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,worker,test,dev]"
      - name: Migrate
        run: alembic upgrade head
      - name: Coverage gate
        run: pytest -q --cov=aegis --cov-report=term-missing --cov-fail-under=90

  api-integration:
    name: API integration (Postgres + Redis)
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    env:
      AEGIS_DB_URL: postgresql+psycopg://aegis:aegis@localhost:5432/aegis
      AEGIS_BROKER_URL: redis://localhost:6379/0
      AEGIS_RESULT_BACKEND: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -e ".[api,worker,test]"
      - name: Migrate
        run: alembic upgrade head
      - name: Integration tests
        run: pytest -q -m "not e2e and not docker and not slow" tests/

  web-build:
    name: Next.js build (pnpm, frozen lockfile)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      # Workspace lives at the repo root (v0.4.0 F16); install from
      # there so both @aegis/web and @aegis/design-system are linked.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # Design-system ships the shared component layer; its real source
      # (components + primitives + index) must type-check cleanly. Stories
      # are excluded via tsconfig.build.json (their @storybook/react types
      # live only in the web workspace), so this gate is blocking.
      - name: Typecheck design-system
        run: pnpm --filter @aegis/design-system run typecheck
      - name: Typecheck web
        run: pnpm --filter @aegis/web typecheck
      - name: Test web (vitest)
        run: pnpm --filter @aegis/web test
      - name: Build
        run: pnpm --filter @aegis/web build

  docker-images:
    name: Build images (no push)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.api
          push: false
      - name: Build worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.worker
          push: false
      - name: Build web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.web
          push: false
      - name: Build log-ingest
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.log_ingest
          push: false

  e2e-stack:
    name: Stack E2E (Playwright, fixture-assisted)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    needs: [api-integration, web-build]
    env:
      AEGIS_E2E_STACK: "1"
      AEGIS_DISABLE_LLM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Aegis
        run: pip install -e ".[api,worker,test]"
      - name: Bring stack up
        working-directory: deploy
        run: docker compose up -d --build
      - name: Playwright
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose down -v
