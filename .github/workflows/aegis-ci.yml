name: Aegis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the fixture-assisted E2E + stack E2E jobs"
        type: boolean
        default: false

jobs:
  unit:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Aegis
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"

      - name: Verify uv.lock is up to date
        run: |
          pip install uv
          uv lock --check || (echo "::error::uv.lock is out of sync with pyproject.toml. Run 'uv lock' and commit."; exit 1)

      - name: Lint (ruff)
        run: ruff check aegis tests

      - name: Type-check (mypy)
        continue-on-error: true
        run: mypy aegis

      - name: Run tests
        run: pytest -q --cov=aegis --cov-report=term-missing

  no-leaked-artifacts:
    name: aegis_output is not committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if aegis_output is tracked
        run: |
          if git ls-files --error-unmatch aegis_output 2>/dev/null; then
            echo "::error::aegis_output/ is tracked in git; add to .gitignore and untrack"
            exit 1
          fi

  submodule-integrity:
    name: Submodules pinned and clean
    runs-on: ubuntu-latest
    steps:
      # Top-level only: we vendor Strix, CAI, and mcp-kali-server. CAI carries
      # its own nested benchmark submodules pinned at commits upstream has since
      # made unfetchable, so a recursive checkout would fail on refs we don't own.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Submodules at pinned commit (no -/+/U prefix)
        run: |
          status="$(git submodule status)"
          echo "$status"
          if echo "$status" | grep -qE '^[-+U]'; then
            echo "::error::A submodule is not at its pinned commit (-/+/U prefix). Run 'git submodule update --init'."
            exit 1
          fi
      - name: Submodule working trees are clean
        run: |
          git submodule foreach '
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "::error::Submodule $name has uncommitted changes (vendored upstream must stay pristine)"; exit 1
            fi
          '

  secret-scan:
    name: Secret scan (trufflehog, verified only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install trufflehog
        run: curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Scan filesystem (verified secrets only)
        run: trufflehog filesystem . --only-verified --fail --no-update

  coverage:
    name: Coverage (>=90%)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    env:
      AEGIS_DB_URL: postgresql+psycopg://aegis:aegis@localhost:5432/aegis
      AEGIS_BROKER_URL: redis://localhost:6379/0
      AEGIS_RESULT_BACKEND: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Aegis
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,worker,test,dev]"
      - name: Migrate
        run: alembic upgrade head
      - name: Coverage gate
        run: pytest -q --cov=aegis --cov-report=term-missing --cov-fail-under=90

  api-integration:
    name: API integration (Postgres + Redis)
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    env:
      AEGIS_DB_URL: postgresql+psycopg://aegis:aegis@localhost:5432/aegis
      AEGIS_BROKER_URL: redis://localhost:6379/0
      AEGIS_RESULT_BACKEND: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -e ".[api,worker,test]"
      - name: Migrate
        run: alembic upgrade head
      - name: Integration tests
        run: pytest -q -m "not e2e and not docker and not slow" tests/

  web-build:
    name: Next.js build (pnpm, frozen lockfile)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      # Workspace lives at the repo root (v0.4.0 F16); install from
      # there so both @aegis/web and @aegis/design-system are linked.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @aegis/web typecheck || true
      - name: Build
        run: pnpm --filter @aegis/web build

  docker-images:
    name: Build images (no push)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.api
          push: false
      - name: Build worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.worker
          push: false
      - name: Build web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.web
          push: false
      - name: Build log-ingest
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.log_ingest
          push: false

  e2e-stack:
    name: Stack E2E (Playwright, fixture-assisted)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    needs: [api-integration, web-build]
    env:
      AEGIS_E2E_STACK: "1"
      AEGIS_DISABLE_LLM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Aegis
        run: pip install -e ".[api,worker,test]"
      - name: Bring stack up
        working-directory: deploy
        run: docker compose up -d --build
      - name: Playwright
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose down -v
