# Dependabot update config (cluster C2).
#
# Keeps every dependency surface patched: the Python project, the web
# workspace, the GitHub Actions we pin, and the deploy Dockerfiles. Weekly
# cadence with a small open-PR cap so updates stay reviewable; grouping keeps
# routine bumps to one PR per ecosystem.
version: 2
updates:
  # Python deps resolved from pyproject.toml at the repo root (no lockfile
  # is committed).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns:
          - "*"

  # Frontend workspace. The manifest lives in web/; the pnpm workspace
  # lockfile at the repo root is resolved from there.
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web:
        patterns:
          - "*"

  # The pinned actions used by the workflows under .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  # Base images for the deploy Dockerfiles (api, worker, web, log_ingest,
  # postgres). `directories` globs every Dockerfile under deploy/.
  - package-ecosystem: docker
    directories:
      - "/deploy"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns:
          - "*"
