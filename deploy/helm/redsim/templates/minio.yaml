{{/*
minio — S3-compatible blob backend. Gated by minio.enabled; disable when
using a managed S3 (AWS S3, etc.) and point config.s3Endpoint at it. Mirrors
the minio service in deploy/docker-compose.yml. StatefulSet for stable
storage. Root creds come from the rendered Secret (not hardcoded into env).
*/}}
{{- if .Values.minio.enabled }}
{{- $component := "minio" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redsim.componentName" (dict "ctx" . "component" $component) }}
  labels:
    {{- include "redsim.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  serviceName: {{ include "redsim.componentName" (dict "ctx" . "component" $component) }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "redsim.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redsim.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: {{ include "redsim.image" (dict "ctx" . "image" .Values.minio.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            # Root creds are sourced from the chart Secret. The MinIO root
            # user maps to the same value the api/worker use as
            # REDSIM_S3_ACCESS_KEY_ID / REDSIM_S3_SECRET_ACCESS_KEY so the in-
            # cluster S3 endpoint authenticates with one credential set.
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "redsim.secretName" . }}
                  key: REDSIM_S3_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "redsim.secretName" . }}
                  key: REDSIM_S3_SECRET_ACCESS_KEY
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      {{- if not .Values.minio.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.minio.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.minio.persistence.storageClass }}
        storageClassName: {{ .Values.minio.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.minio.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redsim.componentName" (dict "ctx" . "component" $component) }}
  labels:
    {{- include "redsim.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  selector:
    {{- include "redsim.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: s3
      port: {{ .Values.minio.service.apiPort }}
      targetPort: s3
    - name: console
      port: {{ .Values.minio.service.consolePort }}
      targetPort: console
{{- end }}
