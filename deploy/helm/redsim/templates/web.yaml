{{/*
redsim-web — Next.js 14 UI on :3000. Mirrors the redsim-web service in
deploy/docker-compose.yml (NEXT_PUBLIC_REDSIM_API_URL / BETTER_AUTH_* /
KEYCLOAK_*).

Recreate, not the default RollingUpdate, and one replica: Better Auth is
stateless on the in-memory adapter, so a second web pod resolves no session
past the cookie-cache window. See values.yaml web.replicaCount.
*/}}
{{- $component := "web" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redsim.componentName" (dict "ctx" . "component" $component) }}
  labels:
    {{- include "redsim.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  strategy:
    {{- toYaml .Values.web.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "redsim.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redsim.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "redsim.podSecurityContext" . | nindent 8 }}
      {{- if and .Values.web.keycloakGate.enabled .Values.config.oidcIssuer }}
      # Hold the pod until Keycloak serves discovery. The provider is resolved
      # once at module import and never retried, so starting early is a
      # permanent failure that no probe here would catch (see values.yaml
      # web.keycloakGate). Polls the same URL the provider will fetch, read
      # from the same ConfigMap key, so the two cannot drift.
      initContainers:
        - name: wait-for-keycloak
          image: {{ .Values.web.keycloakGate.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "redsim.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          env:
            - name: KEYCLOAK_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "redsim.configMapName" . }}
                  key: REDSIM_OIDC_ISSUER
          command: ["/bin/sh", "-c"]
          args:
            - |
              url="$KEYCLOAK_ISSUER/.well-known/openid-configuration"
              attempts={{ .Values.web.keycloakGate.retries }}
              i=0
              while [ "$i" -lt "$attempts" ]; do
                if wget -q -T 5 -O /dev/null "$url"; then
                  echo "keycloak discovery ready at $url"
                  exit 0
                fi
                i=$((i + 1))
                echo "waiting for keycloak discovery at $url ($i/$attempts)"
                sleep {{ .Values.web.keycloakGate.intervalSeconds }}
              done
              echo "keycloak discovery unavailable at $url after $attempts attempts"
              exit 1
          resources:
            {{- toYaml .Values.web.keycloakGate.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "redsim.image" (dict "ctx" . "image" .Values.web.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "redsim.containerSecurityContext" (dict "readOnlyRootFilesystem" .Values.web.readOnlyRootFilesystem) | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_REDSIM_API_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "redsim.configMapName" . }}
                  key: NEXT_PUBLIC_REDSIM_API_URL
            - name: BETTER_AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "redsim.configMapName" . }}
                  key: BETTER_AUTH_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "redsim.secretName" . }}
                  key: BETTER_AUTH_SECRET
            # Without this the web process never sees REDSIM_ENV, isProd is
            # false on every Helm deploy including config.env=prod, and both
            # redsim cookies ship without Secure. The ConfigMap already
            # defines the key for the api and worker pods.
            - name: REDSIM_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "redsim.configMapName" . }}
                  key: REDSIM_ENV
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "redsim.configMapName" . }}
                  key: KEYCLOAK_CLIENT_ID
            # Discovery runs container to container against the in-cluster
            # realm, reusing the issuer the api already resolves.
            - name: KEYCLOAK_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "redsim.configMapName" . }}
                  key: REDSIM_OIDC_ISSUER
            - name: REDSIM_API_SESSION_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "redsim.secretName" . }}
                  key: REDSIM_API_SESSION_PRIVATE_KEY
          # Next.js serves the app root once the server is listening.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redsim.componentName" (dict "ctx" . "component" $component) }}
  labels:
    {{- include "redsim.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "redsim.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
