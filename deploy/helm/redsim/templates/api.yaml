{{/*
redsim-api — FastAPI app (runs `alembic upgrade head` then uvicorn on :8000).
Mirrors the redsim-api service in deploy/docker-compose.yml.
*/}}
{{- $component := "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redsim.componentName" (dict "ctx" . "component" $component) }}
  labels:
    {{- include "redsim.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "redsim.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redsim.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "redsim.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "redsim.image" (dict "ctx" . "image" .Values.api.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "redsim.containerSecurityContext" (dict "readOnlyRootFilesystem" .Values.api.readOnlyRootFilesystem) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "redsim.configMapName" . }}
            - secretRef:
                name: {{ include "redsim.secretName" . }}
          # Reuses the compose health intent: the api exposes /health.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redsim.componentName" (dict "ctx" . "component" $component) }}
  labels:
    {{- include "redsim.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "redsim.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
