{{/*
postgres — in-cluster Postgres (redsim-postgres image: pgaudit on top of
postgres:16). Gated by postgres.enabled; disable when using a managed
Postgres and point config.dbUrl at it. StatefulSet for stable storage +
identity. Mirrors the postgres service in deploy/docker-compose.yml.
*/}}
{{- if .Values.postgres.enabled }}
{{- $component := "postgres" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redsim.componentName" (dict "ctx" . "component" $component) }}
  labels:
    {{- include "redsim.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  serviceName: {{ include "redsim.componentName" (dict "ctx" . "component" $component) }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "redsim.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redsim.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # Postgres official + pgaudit images run as the `postgres` user
        # (uid 999). fsGroup lets the data volume be writable.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ include "redsim.image" (dict "ctx" . "image" .Values.postgres.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.auth.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- if not .Values.postgres.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.persistence.storageClass }}
        storageClassName: {{ .Values.postgres.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redsim.componentName" (dict "ctx" . "component" $component) }}
  labels:
    {{- include "redsim.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  selector:
    {{- include "redsim.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
{{- end }}
