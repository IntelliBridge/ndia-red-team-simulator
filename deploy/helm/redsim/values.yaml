# Default values for the Redsim Helm chart.
#
# Mirrors deploy/docker-compose.yml. Override per-environment with a
# values file (`helm install -f prod-values.yaml ...`). Secrets here are
# DEV placeholders — supply real values via --set / a sealed values file
# or an external secret store in production.
#
# NOTE: This chart targets a real Kubernetes cluster. It is NOT deployed
# locally; manifests are validated for YAML/template correctness only.

# -- Common labels / naming ---------------------------------------------------
nameOverride: ""
fullnameOverride: ""

# Global image pull policy + optional registry prefix applied to every
# service image (e.g. "ghcr.io/intellibridge/"). Leave blank for local
# dev image names (redsim-api:dev, etc.).
global:
  imageRegistry: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

# -- Redsim application config (the REDSIM_* knobs compose sets) -----------------
# Non-secret config lands in a ConfigMap; secret-bearing values land in a
# Secret (see config.secret below). Service URLs default to in-cluster DNS
# names that line up with the dependency Services this chart renders.
config:
  # Mirrors deploy/docker-compose.yml (REDSIM_ENV=dev). The shipped
  # config.secret.* values are DEV placeholders, so the default env is dev;
  # set env=prod via your prod values file, which activates the secret guard
  # in templates/secret.yaml that refuses to deploy those placeholders.
  env: dev
  authMode: dev
  # SQLAlchemy URL. When postgres.enabled=true this points at the in-cluster
  # Service; override for a managed Postgres.
  dbUrl: postgresql+psycopg://redsim:redsim@redsim-postgres:5432/redsim
  brokerUrl: redis://redsim-redis:6379/0
  resultBackend: redis://redsim-redis:6379/1
  blobBackend: s3
  s3Endpoint: http://redsim-minio:9000
  s3Bucket: redsim
  corsOrigins: http://localhost:3300
  # OIDC issuer/JWKS resolve to the in-cluster Keycloak Service by default.
  oidcIssuer: http://redsim-keycloak:8080/realms/redsim
  oidcJwksUrl: http://redsim-keycloak:8080/realms/redsim/protocol/openid-connect/certs
  disableLlm: "1"
  # Web (Next.js) public config.
  webApiUrl: http://localhost:8000
  # Browser-facing origin for Better Auth.
  betterAuthUrl: http://localhost:3300
  # The redsim-web realm client is public and uses PKCE, so there is no
  # client secret to carry. If a confidential client is ever adopted, its
  # secret belongs in config.secret, never here.
  keycloakClientId: redsim-web

  # Secret-bearing values. Templated into a Secret, NEVER hardcoded into a
  # ConfigMap. Override these in production. existingSecret short-circuits
  # the rendered Secret so you can wire an external secret store instead.
  #
  # Production safety: when config.env=prod the chart REFUSES to render with
  # these dev placeholders still in place and no externally-managed secret
  # wired in (see templates/secret.yaml). Supply one of:
  #   - real values via --set / a sealed values file, or
  #   - secret.existingSecret pointing at a pre-provisioned Secret, or
  #   - secret.externalSecrets.enabled=true to render an ExternalSecret that
  #     the External Secrets Operator reconciles from your backing store.
  secret:
    # Name of a pre-existing Secret to consume instead of rendering one here.
    # When set, secret.yaml is skipped and every component reads this Secret.
    existingSecret: ""
    s3AccessKeyId: redsim
    s3SecretAccessKey: redsim-secret
    # At least 32 characters, which the previous 20-character placeholder
    # was not. Rotating it invalidates every live browser session.
    betterAuthSecret: dev-better-auth-secret-change-me-32chars
    # Operator-supplied RS256 PKCS8 PEM. FastAPI verifies the
    # redsim_api_session cookie against its public half, so the two sides
    # must agree. Empty means the login completes and mints no cookies.
    apiSessionPrivateKey: ""
    # The matching SubjectPublicKeyInfo PEM, read by the api as
    # REDSIM_API_SESSION_PUBLIC_KEY. The operator supplies both halves of one
    # keypair. Empty means the api verifies no cookie the web tier mints and
    # answers 401 to every browser call.
    apiSessionPublicKey: ""
    # External Secrets Operator integration. When enabled, the chart renders
    # an ExternalSecret (templates/externalsecret.yaml) that materialises the
    # config Secret from an external store (Vault, AWS/GCP SM, etc.) instead
    # of templating the secret values above. The materialised Secret reuses
    # redsim.secretName, so components need no change. Requires the External
    # Secrets Operator (external-secrets.io) installed in the cluster.
    externalSecrets:
      enabled: false
      # ClusterSecretStore/SecretStore the operator pulls from.
      secretStoreRef:
        name: redsim
        kind: ClusterSecretStore
      # How often the operator re-syncs the backing store.
      refreshInterval: 1h
      # Map each Secret key to a remote key/property in the backing store.
      # remoteRef.key is the path in the store; property is the field within.
      data:
        - secretKey: REDSIM_S3_ACCESS_KEY_ID
          remoteRef:
            key: redsim/s3
            property: access_key_id
        - secretKey: REDSIM_S3_SECRET_ACCESS_KEY
          remoteRef:
            key: redsim/s3
            property: secret_access_key
        - secretKey: BETTER_AUTH_SECRET
          remoteRef:
            key: redsim/better-auth
            property: secret
        - secretKey: REDSIM_API_SESSION_PRIVATE_KEY
          remoteRef:
            key: redsim/api-session
            property: private_key
        - secretKey: REDSIM_API_SESSION_PUBLIC_KEY
          remoteRef:
            key: redsim/api-session
            property: public_key

# -- Sandbox isolation (gVisor) -----------------------------------------------
# gVisor (`runsc`) sandboxes the worker pod, which executes untrusted plugin /
# attack-adapter workloads out-of-process. Requires gVisor installed on the
# nodes and a matching RuntimeClass; the RuntimeClass template below is
# rendered when sandbox.enabled=true. When disabled, the pod falls back to the
# default runtime (no runtimeClassName set).
sandbox:
  enabled: false
  # Name of the RuntimeClass object + its handler (must match the gVisor
  # install on the node, typically "runsc").
  runtimeClassName: gvisor
  handler: runsc

# -- Per-service settings -----------------------------------------------------
api:
  replicaCount: 2
  image:
    repository: redsim-api
    tag: dev
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  # The api runs `alembic upgrade head` then uvicorn; readOnlyRootFilesystem
  # is left off because the migration step needs a writable workdir.
  readOnlyRootFilesystem: false

worker:
  replicaCount: 2
  image:
    repository: redsim-worker
    tag: dev
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }
  readOnlyRootFilesystem: false

web:
  # Pinned to 1, and not a capacity choice. Better Auth runs stateless with
  # the in-memory adapter, so past the 8 hour cookie-cache window only
  # the instance that handled the OAuth callback resolves the session.
  # A second replica produces intermittent sign-outs with no error in any
  # log. Scaling this up needs a shared session store first.
  replicaCount: 1
  # Recreate for the same reason: the default RollingUpdate surges a
  # second pod on every release, which the replica pin exists to prevent.
  strategy:
    type: Recreate
  image:
    repository: redsim-web
    tag: dev
  # Keycloak readiness gate. OIDC discovery runs once, in the generic-oauth
  # plugin's init at module import, and a failed fetch is logged and the
  # provider dropped rather than retried. A pod that starts before Keycloak
  # answers therefore serves a login page with no working provider until
  # something restarts it, while its own probes stay green. This init container
  # is the chart's counterpart to the compose healthcheck and depends_on
  # ordering. It polls the exact URL discovery will fetch and is skipped when
  # config.oidcIssuer is empty, which is the supported no-realm dev mode.
  keycloakGate:
    enabled: true
    # Any image carrying a POSIX shell and wget. busybox is the smallest.
    image: busybox:1.37
    # retries times intervalSeconds is the bound, 5 minutes by default.
    retries: 60
    intervalSeconds: 5
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { cpu: 100m, memory: 64Mi }
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  readOnlyRootFilesystem: false

logIngest:
  replicaCount: 1
  image:
    repository: redsim-log-ingest
    tag: dev
  service:
    type: ClusterIP
    port: 4319
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  readOnlyRootFilesystem: true

# -- Stateful dependencies (gate off when using managed equivalents) ----------
postgres:
  enabled: true
  image:
    # Compose builds redsim-postgres:dev (pgaudit on top of postgres:16).
    repository: redsim-postgres
    tag: dev
  auth:
    username: redsim
    password: redsim
    database: redsim
  service:
    port: 5432
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  service:
    port: 6379
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

keycloak:
  enabled: true
  # HA: default to 2 replicas when enabled. Production HA Keycloak requires a
  # shared external database (set config.dbUrl-equivalent for Keycloak below)
  # AND a distributed Infinispan cache (jgroups discovery) so sessions/tokens
  # stay consistent across replicas. `start-dev` (used here for parity with
  # compose) uses an embedded H2 + local cache and is NOT HA-safe — for real
  # HA switch the command to `start --optimized` and point KC_DB at the shared
  # Postgres + configure KC_CACHE=ispn with a discovery stack (see comment in
  # templates/keycloak.yaml).
  replicas: 2
  image:
    repository: quay.io/keycloak/keycloak
    tag: "24.0"
  admin:
    user: admin
    password: admin
  service:
    port: 8080
  # Import the bundled realm-export.json. The realm JSON is shipped via a
  # ConfigMap mounted into the import dir.
  importRealm: true
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

minio:
  enabled: true
  image:
    repository: quay.io/minio/minio
    tag: latest
  auth:
    rootUser: redsim
    rootPassword: redsim-secret
  service:
    apiPort: 9000
    consolePort: 9001
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

# -- Ingress ------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  # Hosts route to the web UI and the api. Adjust to your domain.
  hosts:
    - host: redsim.local
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /api
          pathType: Prefix
          service: api
  tls: []
  #  - secretName: redsim-tls
  #    hosts: [redsim.local]
