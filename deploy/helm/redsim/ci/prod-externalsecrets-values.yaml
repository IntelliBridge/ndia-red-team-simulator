# CI fixture: a prod deployment that sources its config Secret from the
# External Secrets Operator. `helm template` with this file MUST succeed
# (the guard is satisfied by externalSecrets.enabled) and render an
# ExternalSecret instead of an inline Secret. Exercised by the helm-lint job.
config:
  env: prod
  secret:
    existingSecret: ""
    s3AccessKeyId: redsim
    s3SecretAccessKey: redsim-secret
    betterAuthSecret: dev-better-auth-secret-change-me-32chars
    externalSecrets:
      enabled: true
      secretStoreRef:
        name: redsim-vault
        kind: ClusterSecretStore
