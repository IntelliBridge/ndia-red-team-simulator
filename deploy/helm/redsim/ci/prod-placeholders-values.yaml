# CI fixture: a prod deployment that LEFT the dev secret placeholders in place
# and wired no external secret. `helm template` with this file MUST fail via the
# redsim.validateProdSecret guard (see templates/secret.yaml / _helpers.tpl).
# Exercised by the helm-lint job in .github/workflows/redsim-ci.yml.
config:
  env: prod
  secret:
    existingSecret: ""
    s3AccessKeyId: redsim
    s3SecretAccessKey: redsim-secret
    betterAuthSecret: dev-better-auth-secret-change-me-32chars
    externalSecrets:
      enabled: false
