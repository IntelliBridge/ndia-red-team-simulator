{{/*
gVisor RuntimeClass for sandboxed (untrusted) tool execution.

Rendered only when sandbox.enabled=true. The worker Deployment sets
`runtimeClassName: {{ .Values.sandbox.runtimeClassName }}` so its pod runs
under the gVisor `runsc` runtime instead of the default OCI runtime.

PREREQUISITE: gVisor MUST be installed on every node that schedules these
pods (the runtime handler below — typically "runsc" — must exist in the
node's containerd config, e.g. containerd's `runtimes.runsc` section). The
chart cannot install gVisor on nodes; it only declares the RuntimeClass.
*/}}
{{- if .Values.sandbox.enabled }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.sandbox.runtimeClassName }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
# The handler must match the runtime configured on the nodes (containerd
# `runtimes.<handler>`). For gVisor this is conventionally "runsc".
handler: {{ .Values.sandbox.handler }}
{{- end }}
