{{/*
ExternalSecret (external-secrets.io) that materialises the config Secret from
an external backing store (Vault, AWS/GCP Secrets Manager, etc.) instead of
templating secret values into the chart. Rendered only when
config.secret.externalSecrets.enabled AND no config.secret.existingSecret is
supplied (an existingSecret means the operator manages it out-of-band).

The operator reconciles this resource into a Secret named aegis.secretName
(the same name secret.yaml would otherwise render), so api/worker/web read it
unchanged. Requires the External Secrets Operator installed in the cluster.
*/}}
{{- if and .Values.config.secret.externalSecrets.enabled (not .Values.config.secret.existingSecret) }}
{{- $es := .Values.config.secret.externalSecrets }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "aegis.secretName" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name | quote }}
    kind: {{ $es.secretStoreRef.kind | quote }}
  target:
    name: {{ include "aegis.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $es.data }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .remoteRef.key | quote }}
        {{- if .remoteRef.property }}
        property: {{ .remoteRef.property | quote }}
        {{- end }}
    {{- end }}
{{- end }}
