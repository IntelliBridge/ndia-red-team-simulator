{{/*
Non-secret AEGIS_* config shared by api / worker / log-ingest, plus the
web public env. Secret-bearing values live in secret.yaml. Mirrors the
environment blocks in deploy/docker-compose.yml.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis.configMapName" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
data:
  AEGIS_ENV: {{ .Values.config.env | quote }}
  AEGIS_AUTH_MODE: {{ .Values.config.authMode | quote }}
  AEGIS_DB_URL: {{ .Values.config.dbUrl | quote }}
  AEGIS_BROKER_URL: {{ .Values.config.brokerUrl | quote }}
  AEGIS_RESULT_BACKEND: {{ .Values.config.resultBackend | quote }}
  AEGIS_BLOB_BACKEND: {{ .Values.config.blobBackend | quote }}
  AEGIS_S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  AEGIS_S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  AEGIS_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  AEGIS_OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  AEGIS_OIDC_JWKS_URL: {{ .Values.config.oidcJwksUrl | quote }}
  AEGIS_KALI_URL: {{ .Values.config.kaliUrl | quote }}
  AEGIS_DISABLE_LLM: {{ .Values.config.disableLlm | quote }}
  # Web (Next.js) public config.
  NEXT_PUBLIC_AEGIS_API_URL: {{ .Values.config.webApiUrl | quote }}
  NEXTAUTH_URL: {{ .Values.config.nextAuthUrl | quote }}
