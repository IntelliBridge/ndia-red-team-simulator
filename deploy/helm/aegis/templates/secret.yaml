{{/*
Secret-bearing AEGIS_* values. Rendered only when an existingSecret is NOT
supplied — in production, point config.secret.existingSecret at a Secret
managed by an external store (Vault, External Secrets, sealed-secrets) and
this template is skipped. Values are templated from .Values, never
hardcoded into the chart.
*/}}
{{- if not .Values.config.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis.secretName" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
type: Opaque
stringData:
  AEGIS_S3_ACCESS_KEY_ID: {{ .Values.config.secret.s3AccessKeyId | quote }}
  AEGIS_S3_SECRET_ACCESS_KEY: {{ .Values.config.secret.s3SecretAccessKey | quote }}
  NEXTAUTH_SECRET: {{ .Values.config.secret.nextAuthSecret | quote }}
{{- end }}
