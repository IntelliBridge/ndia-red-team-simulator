{{/*
Secret-bearing AEGIS_* values. Rendered only when neither an existingSecret
NOR the External Secrets Operator supplies the config Secret — in production,
point config.secret.existingSecret at a Secret managed by an external store
(Vault, External Secrets, sealed-secrets) or set
config.secret.externalSecrets.enabled (see externalsecret.yaml), and this
template is skipped. Values are templated from .Values, never hardcoded into
the chart.

Before rendering, a prod-safety guard aborts the release if these shipped DEV
placeholders would otherwise reach a prod environment with no externally
managed secret wired in (see "aegis.validateProdSecret" in _helpers.tpl).
*/}}
{{- include "aegis.validateProdSecret" . -}}
{{- if and (not .Values.config.secret.existingSecret) (not .Values.config.secret.externalSecrets.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis.secretName" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
type: Opaque
stringData:
  AEGIS_S3_ACCESS_KEY_ID: {{ .Values.config.secret.s3AccessKeyId | quote }}
  AEGIS_S3_SECRET_ACCESS_KEY: {{ .Values.config.secret.s3SecretAccessKey | quote }}
  NEXTAUTH_SECRET: {{ .Values.config.secret.nextAuthSecret | quote }}
{{- end }}
