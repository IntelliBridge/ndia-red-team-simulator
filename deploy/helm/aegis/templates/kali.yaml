{{/*
kali — MCP Kali REST shim on :5000 that executes scan tools (nmap, etc.).
This pod runs UNTRUSTED workloads, so it gets the gVisor RuntimeClass when
sandbox.enabled=true. Mirrors the kali service in deploy/docker-compose.yml.
*/}}
{{- $component := "kali" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.componentName" (dict "ctx" . "component" $component) }}
  labels:
    {{- include "aegis.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.kali.replicaCount }}
  selector:
    matchLabels:
      {{- include "aegis.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.sandbox.enabled }}
      # gVisor sandbox for untrusted tool execution. Requires gVisor + the
      # matching RuntimeClass installed on the scheduling nodes (see
      # templates/runtimeclass.yaml).
      runtimeClassName: {{ .Values.sandbox.runtimeClassName }}
      {{- end }}
      securityContext:
        {{- include "aegis.podSecurityContext" . | nindent 8 }}
      containers:
        - name: kali
          image: {{ include "aegis.image" (dict "ctx" . "image" .Values.kali.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "aegis.containerSecurityContext" (dict "readOnlyRootFilesystem" .Values.kali.readOnlyRootFilesystem) | nindent 12 }}
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: AEGIS_KALI_ALLOW_GENERIC_COMMAND
              value: {{ .Values.kali.allowGenericCommand | quote }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.kali.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis.componentName" (dict "ctx" . "component" $component) }}
  labels:
    {{- include "aegis.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: {{ .Values.kali.service.type }}
  selector:
    {{- include "aegis.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.kali.service.port }}
      targetPort: http
