{{/*
aegis-worker — Celery worker that executes scan/tool workloads. This pod
runs UNTRUSTED workloads, so it gets the gVisor RuntimeClass when
sandbox.enabled=true. No Service: it's a queue consumer, not a server.
Mirrors the aegis-worker service in deploy/docker-compose.yml.
*/}}
{{- $component := "worker" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.componentName" (dict "ctx" . "component" $component) }}
  labels:
    {{- include "aegis.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "aegis.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.sandbox.enabled }}
      # gVisor sandbox for untrusted tool execution. Requires gVisor + the
      # matching RuntimeClass installed on the scheduling nodes (see
      # templates/runtimeclass.yaml).
      runtimeClassName: {{ .Values.sandbox.runtimeClassName }}
      {{- end }}
      securityContext:
        {{- include "aegis.podSecurityContext" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "aegis.image" (dict "ctx" . "image" .Values.worker.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "aegis.containerSecurityContext" (dict "readOnlyRootFilesystem" .Values.worker.readOnlyRootFilesystem) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "aegis.configMapName" . }}
            - secretRef:
                name: {{ include "aegis.secretName" . }}
          # Liveness via celery's own ping; readiness mirrors it. Avoids a
          # false-healthy pod while the broker connection is down.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A aegis.workers.celery_app inspect ping -d celery@$HOSTNAME
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A aegis.workers.celery_app inspect ping -d celery@$HOSTNAME
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
