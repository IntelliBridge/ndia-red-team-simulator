# Default values for the Aegis Helm chart.
#
# Mirrors deploy/docker-compose.yml. Override per-environment with a
# values file (`helm install -f prod-values.yaml ...`). Secrets here are
# DEV placeholders — supply real values via --set / a sealed values file
# or an external secret store in production.
#
# NOTE: This chart targets a real Kubernetes cluster. It is NOT deployed
# locally; manifests are validated for YAML/template correctness only.

# -- Common labels / naming ---------------------------------------------------
nameOverride: ""
fullnameOverride: ""

# Global image pull policy + optional registry prefix applied to every
# service image (e.g. "ghcr.io/intellibridge/"). Leave blank for local
# dev image names (aegis-api:dev, etc.).
global:
  imageRegistry: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

# -- Aegis application config (the AEGIS_* knobs compose sets) -----------------
# Non-secret config lands in a ConfigMap; secret-bearing values land in a
# Secret (see config.secret below). Service URLs default to in-cluster DNS
# names that line up with the dependency Services this chart renders.
config:
  # Mirrors deploy/docker-compose.yml (AEGIS_ENV=dev). The shipped
  # config.secret.* values are DEV placeholders, so the default env is dev;
  # set env=prod via your prod values file, which activates the secret guard
  # in templates/secret.yaml that refuses to deploy those placeholders.
  env: dev
  authMode: dev
  # SQLAlchemy URL. When postgres.enabled=true this points at the in-cluster
  # Service; override for a managed Postgres.
  dbUrl: postgresql+psycopg://aegis:aegis@aegis-postgres:5432/aegis
  brokerUrl: redis://aegis-redis:6379/0
  resultBackend: redis://aegis-redis:6379/1
  blobBackend: s3
  s3Endpoint: http://aegis-minio:9000
  s3Bucket: aegis
  corsOrigins: http://localhost:3300
  # OIDC issuer/JWKS resolve to the in-cluster Keycloak Service by default.
  oidcIssuer: http://aegis-keycloak:8080/realms/aegis
  oidcJwksUrl: http://aegis-keycloak:8080/realms/aegis/protocol/openid-connect/certs
  disableLlm: "1"
  # Web (Next.js) public config.
  webApiUrl: http://localhost:8000
  nextAuthUrl: http://localhost:3300

  # Secret-bearing values. Templated into a Secret, NEVER hardcoded into a
  # ConfigMap. Override these in production. existingSecret short-circuits
  # the rendered Secret so you can wire an external secret store instead.
  #
  # Production safety: when config.env=prod the chart REFUSES to render with
  # these dev placeholders still in place and no externally-managed secret
  # wired in (see templates/secret.yaml). Supply one of:
  #   - real values via --set / a sealed values file, or
  #   - secret.existingSecret pointing at a pre-provisioned Secret, or
  #   - secret.externalSecrets.enabled=true to render an ExternalSecret that
  #     the External Secrets Operator reconciles from your backing store.
  secret:
    # Name of a pre-existing Secret to consume instead of rendering one here.
    # When set, secret.yaml is skipped and every component reads this Secret.
    existingSecret: ""
    s3AccessKeyId: aegis
    s3SecretAccessKey: aegis-secret
    nextAuthSecret: dev-secret-change-me
    # External Secrets Operator integration. When enabled, the chart renders
    # an ExternalSecret (templates/externalsecret.yaml) that materialises the
    # config Secret from an external store (Vault, AWS/GCP SM, etc.) instead
    # of templating the secret values above. The materialised Secret reuses
    # aegis.secretName, so components need no change. Requires the External
    # Secrets Operator (external-secrets.io) installed in the cluster.
    externalSecrets:
      enabled: false
      # ClusterSecretStore/SecretStore the operator pulls from.
      secretStoreRef:
        name: aegis
        kind: ClusterSecretStore
      # How often the operator re-syncs the backing store.
      refreshInterval: 1h
      # Map each Secret key to a remote key/property in the backing store.
      # remoteRef.key is the path in the store; property is the field within.
      data:
        - secretKey: AEGIS_S3_ACCESS_KEY_ID
          remoteRef:
            key: aegis/s3
            property: access_key_id
        - secretKey: AEGIS_S3_SECRET_ACCESS_KEY
          remoteRef:
            key: aegis/s3
            property: secret_access_key
        - secretKey: NEXTAUTH_SECRET
          remoteRef:
            key: aegis/nextauth
            property: secret

# -- Sandbox isolation (gVisor) -----------------------------------------------
# gVisor (`runsc`) sandboxes the worker pod, which executes untrusted plugin /
# attack-adapter workloads out-of-process. Requires gVisor installed on the
# nodes and a matching RuntimeClass; the RuntimeClass template below is
# rendered when sandbox.enabled=true. When disabled, the pod falls back to the
# default runtime (no runtimeClassName set).
sandbox:
  enabled: false
  # Name of the RuntimeClass object + its handler (must match the gVisor
  # install on the node, typically "runsc").
  runtimeClassName: gvisor
  handler: runsc

# -- Per-service settings -----------------------------------------------------
api:
  replicaCount: 2
  image:
    repository: aegis-api
    tag: dev
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  # The api runs `alembic upgrade head` then uvicorn; readOnlyRootFilesystem
  # is left off because the migration step needs a writable workdir.
  readOnlyRootFilesystem: false

worker:
  replicaCount: 2
  image:
    repository: aegis-worker
    tag: dev
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }
  readOnlyRootFilesystem: false

web:
  replicaCount: 2
  image:
    repository: aegis-web
    tag: dev
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  readOnlyRootFilesystem: false

logIngest:
  replicaCount: 1
  image:
    repository: aegis-log-ingest
    tag: dev
  service:
    type: ClusterIP
    port: 4319
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  readOnlyRootFilesystem: true

# -- Stateful dependencies (gate off when using managed equivalents) ----------
postgres:
  enabled: true
  image:
    # Compose builds aegis-postgres:dev (pgaudit on top of postgres:16).
    repository: aegis-postgres
    tag: dev
  auth:
    username: aegis
    password: aegis
    database: aegis
  service:
    port: 5432
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  service:
    port: 6379
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

keycloak:
  enabled: true
  # HA: default to 2 replicas when enabled. Production HA Keycloak requires a
  # shared external database (set config.dbUrl-equivalent for Keycloak below)
  # AND a distributed Infinispan cache (jgroups discovery) so sessions/tokens
  # stay consistent across replicas. `start-dev` (used here for parity with
  # compose) uses an embedded H2 + local cache and is NOT HA-safe — for real
  # HA switch the command to `start --optimized` and point KC_DB at the shared
  # Postgres + configure KC_CACHE=ispn with a discovery stack (see comment in
  # templates/keycloak.yaml).
  replicas: 2
  image:
    repository: quay.io/keycloak/keycloak
    tag: "24.0"
  admin:
    user: admin
    password: admin
  service:
    port: 8080
  # Import the bundled realm-export.json. The realm JSON is shipped via a
  # ConfigMap mounted into the import dir.
  importRealm: true
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

minio:
  enabled: true
  image:
    repository: quay.io/minio/minio
    tag: latest
  auth:
    rootUser: aegis
    rootPassword: aegis-secret
  service:
    apiPort: 9000
    consolePort: 9001
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

# -- Ingress ------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  # Hosts route to the web UI and the api. Adjust to your domain.
  hosts:
    - host: aegis.local
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /api
          pathType: Prefix
          service: api
  tls: []
  #  - secretName: aegis-tls
  #    hosts: [aegis.local]
