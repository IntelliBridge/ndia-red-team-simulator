version: "3.9"

services:
  postgres:
    # Custom image adds pgaudit (out-of-band logging of DDL + role/GRANT
    # changes) on top of postgres:16; preload + log classes set via the
    # image CMD. See deploy/Dockerfile.postgres and migration 0004.
    build:
      context: ..
      dockerfile: deploy/Dockerfile.postgres
    image: redsim-postgres:dev
    environment:
      POSTGRES_USER: redsim
      POSTGRES_PASSWORD: redsim
      POSTGRES_DB: redsim
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redsim"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/redsim-realm.json:ro
    # redsim-web runs OIDC discovery at construction and drops the Keycloak
    # provider on a failed fetch, logging a line and then serving no login
    # provider at all. So the web service waits on this, and this needs a
    # healthcheck to wait on. The image carries no curl; bash's /dev/tcp is
    # what the Keycloak project's own examples use.
    healthcheck:
      test:
        ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /realms/redsim HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    # MinIO S3 port mapped to 9100 on the host because 9000 conflicts with
    # other tools (Portainer, llama.cpp, etc.). Container-internal 9000 is
    # unchanged so REDSIM_S3_ENDPOINT=http://minio:9000 still works.
    ports: ["9100:9000", "9101:9001"]
    environment:
      MINIO_ROOT_USER: redsim
      MINIO_ROOT_PASSWORD: redsim-secret
    volumes:
      - minio-data:/data

  redsim-api:
    image: redsim-api:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    environment:
      REDSIM_ENV: dev
      REDSIM_AUTH_MODE: dev
      REDSIM_DB_URL: postgresql+psycopg://redsim:redsim@postgres:5432/redsim
      REDSIM_BROKER_URL: redis://redis:6379/0
      REDSIM_RESULT_BACKEND: redis://redis:6379/1
      REDSIM_BLOB_BACKEND: s3
      REDSIM_S3_ENDPOINT: http://minio:9000
      REDSIM_S3_BUCKET: redsim
      REDSIM_S3_ACCESS_KEY_ID: redsim
      REDSIM_S3_SECRET_ACCESS_KEY: redsim-secret
      REDSIM_CORS_ORIGINS: http://localhost:3300
      # Hygiene, not a fix: the socket handshake is already admitted through
      # REDSIM_CORS_ORIGINS above (redsim/api/ws.py accepts either). Declaring
      # it stops the API from also admitting the unused port 3000 default.
      REDSIM_WEB_ORIGIN: http://localhost:3300
      REDSIM_OIDC_ISSUER: http://keycloak:8080/realms/redsim
      REDSIM_OIDC_JWKS_URL: http://keycloak:8080/realms/redsim/protocol/openid-connect/certs
      # The public half of the keypair redsim-web signs redsim_api_session
      # with. Without it the api verifies no browser cookie and answers 401
      # to every call the UI makes after a successful Keycloak login.
      REDSIM_API_SESSION_PUBLIC_KEY: ${REDSIM_API_SESSION_PUBLIC_KEY:-}
      # Pythia gateway passthrough (docs/ops/pythia.md). Empty when the host
      # shell does not export them, so the LLM narrative simply stays off.
      PYTHIA_BASE_URL: ${PYTHIA_BASE_URL:-}
      PYTHIA_API_KEY: ${PYTHIA_API_KEY:-}
      PYTHIA_PERSONA: ${PYTHIA_PERSONA:-}
      REDSIM_ML_LLM_MODEL: ${REDSIM_ML_LLM_MODEL:-}
    ports: ["8000:8000"]

  # Long-running attack/explain/verify work (-Q scans).
  redsim-worker:
    image: redsim-worker:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    command: ["celery", "-A", "redsim.workers.celery_app", "worker", "-Q", "scans", "--loglevel=info"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: &worker-env
      REDSIM_ENV: dev
      REDSIM_WEB_ORIGIN: http://localhost:3300
      REDSIM_DB_URL: postgresql+psycopg://redsim:redsim@postgres:5432/redsim
      REDSIM_BROKER_URL: redis://redis:6379/0
      REDSIM_RESULT_BACKEND: redis://redis:6379/1
      REDSIM_BLOB_BACKEND: s3
      REDSIM_S3_ENDPOINT: http://minio:9000
      REDSIM_S3_BUCKET: redsim
      REDSIM_S3_ACCESS_KEY_ID: redsim
      REDSIM_S3_SECRET_ACCESS_KEY: redsim-secret
      REDSIM_DISABLE_LLM: "1"
      # Pythia gateway passthrough (docs/ops/pythia.md). The worker also needs
      # REDSIM_DISABLE_LLM unset before the hardening narrative is produced.
      PYTHIA_BASE_URL: ${PYTHIA_BASE_URL:-}
      PYTHIA_API_KEY: ${PYTHIA_API_KEY:-}
      PYTHIA_PERSONA: ${PYTHIA_PERSONA:-}
      REDSIM_ML_LLM_MODEL: ${REDSIM_ML_LLM_MODEL:-}

  # Fast bookkeeping (-Q default): report rendering, the stale-job reaper,
  # tenant reconciliation, and WORM export. Kept off the scans pool so long scans can't
  # starve it. Reuses the worker image + env via the &worker-env anchor.
  redsim-worker-default:
    image: redsim-worker:dev
    command: ["celery", "-A", "redsim.workers.celery_app", "worker", "-Q", "default", "--loglevel=info"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: *worker-env

  # Beat scheduler: the only process that fires app.conf.beat_schedule (the
  # stale-job reaper, every 5 min). Without it the reaper never runs.
  redsim-beat:
    image: redsim-worker:dev
    command: ["celery", "-A", "redsim.workers.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis: { condition: service_healthy }
    environment: *worker-env

  redsim-web:
    image: redsim-web:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    # The long form is required for the Keycloak condition, and Compose does
    # not allow the short list beside it, so redsim-api is carried across
    # explicitly rather than dropped.
    depends_on:
      redsim-api: { condition: service_started }
      keycloak: { condition: service_healthy }
    # Host port :3300 avoids the macOS collision where another local dev
    # server commonly grabs :3000. Container-internal stays :3000 so the
    # Next.js process is unchanged.
    ports: ["3300:3000"]
    environment:
      # The browser reaches FastAPI directly for exactly three surfaces: the
      # run-events socket, artifact images and report downloads. Everything
      # else goes through the tRPC layer inside this container.
      NEXT_PUBLIC_REDSIM_API_URL: http://localhost:8000
      # Where the Next server itself reaches FastAPI. Container to container,
      # so the service name rather than the published port. A runtime
      # variable, not baked into the image.
      REDSIM_API_URL: http://redsim-api:8000
      # Browser-facing origin, so the published port rather than the service
      # name. BETTER_AUTH_SECRET must be at least 32 characters; this dev
      # placeholder is not a secret and must be replaced outside local dev.
      BETTER_AUTH_URL: http://localhost:3300
      BETTER_AUTH_SECRET: dev-better-auth-secret-change-me-32chars
      # The API's existing internal issuer. Discovery happens container to
      # container; the browser reaches the realm on localhost:8080, which is
      # the known hostname split recorded as deferred in the plan.
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/redsim
      KEYCLOAK_CLIENT_ID: redsim-web
      # Operator-supplied. No keypair is committed, so a stack without it
      # completes the login and mints no redsim cookies, and API calls 401.
      REDSIM_API_SESSION_PRIVATE_KEY: ${REDSIM_API_SESSION_PRIVATE_KEY:-}
      REDSIM_ENV: dev

  # ----- Always-on Postgres log mirror (F20c) ------------------------------
  # The redsim-log-ingest sidecar receives OTLP/Logs (under the obs profile)
  # and/or direct JSON batches from the API + worker (default profile) and
  # writes them to application_logs. SELECT * FROM application_logs WHERE
  # run_id='...' returns the full trace without needing Loki or
  # Elasticsearch up.
  redsim-log-ingest:
    image: redsim-log-ingest:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.log_ingest
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      REDSIM_DB_URL: postgresql+psycopg://redsim:redsim@postgres:5432/redsim
    ports: ["4319:4319"]

  # ----- policy profile: external OPA policy engine ------------------------
  # Opt-in (non-default) policy decision point for the role gate. Bring it
  # up with `docker compose --profile policy up opa`, mount the example
  # Rego, then run the API/worker with REDSIM_POLICY_ENGINE=opa and
  # REDSIM_OPA_URL=http://opa:8181. The default `docker compose up` is
  # unchanged — without the profile this service never starts.
  opa:
    image: openpolicyagent/opa:0.66.0
    profiles: ["policy"]
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./opa:/policies:ro
    ports:
      - "8181:8181"

  # ----- obs profile: Collector + Loki + Jaeger ----------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    profiles: ["obs"]
    depends_on:
      redsim-log-ingest: { condition: service_started }
      loki: { condition: service_started }
    volumes:
      - ./otel/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4320:4318"   # OTLP HTTP (4318 taken by Jaeger below; remap)

  loki:
    image: grafana/loki:2.9.7
    profiles: ["obs"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
    ports:
      - "3100:3100"

  jaeger:
    image: jaegertracing/all-in-one:1.55
    profiles: ["obs"]
    ports:
      - "16686:16686"
      - "4318:4318"

  # ----- obs-search profile: Elasticsearch + Kibana ------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    profiles: ["obs-search"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    profiles: ["obs-search"]
    depends_on: [elasticsearch]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

volumes:
  postgres-data:
  minio-data:
