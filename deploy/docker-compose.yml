version: "3.9"

services:
  postgres:
    # Custom image adds pgaudit (out-of-band logging of DDL + role/GRANT
    # changes) on top of postgres:16; preload + log classes set via the
    # image CMD. See deploy/Dockerfile.postgres and migration 0004.
    build:
      context: ..
      dockerfile: deploy/Dockerfile.postgres
    image: redsim-postgres:dev
    environment:
      POSTGRES_USER: redsim
      POSTGRES_PASSWORD: redsim
      POSTGRES_DB: redsim
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redsim"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/redsim-realm.json:ro
    # redsim-web runs OIDC discovery at construction and drops the Keycloak
    # provider on a failed fetch, logging a line and then serving no login
    # provider at all. So the web service waits on this, and this needs a
    # healthcheck to wait on. The image carries no curl; bash's /dev/tcp is
    # what the Keycloak project's own examples use.
    healthcheck:
      test:
        ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /realms/redsim HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    # MinIO S3 port mapped to 9100 on the host because 9000 conflicts with
    # other tools (Portainer, llama.cpp, etc.). Container-internal 9000 is
    # unchanged so REDSIM_S3_ENDPOINT=http://minio:9000 still works.
    ports: ["9100:9000", "9101:9001"]
    environment:
      MINIO_ROOT_USER: redsim
      MINIO_ROOT_PASSWORD: redsim-secret
    volumes:
      - minio-data:/data

  # Creates the bucket the api and the workers write to (REDSIM_S3_BUCKET).
  # MinIO ships no bucket and the blob store creates none, so a fresh stack
  # answered 500 NoSuchBucket on the first model registration. One-shot: the
  # api and the worker pools wait for it to complete, and a rerun is a no-op.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio: { condition: service_started }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 redsim redsim-secret >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing local/redsim

  redsim-api:
    image: redsim-api:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      REDSIM_ENV: dev
      REDSIM_AUTH_MODE: dev
      REDSIM_DB_URL: postgresql+psycopg://redsim:redsim@postgres:5432/redsim
      REDSIM_BROKER_URL: redis://redis:6379/0
      REDSIM_RESULT_BACKEND: redis://redis:6379/1
      REDSIM_BLOB_BACKEND: s3
      REDSIM_S3_ENDPOINT: http://minio:9000
      REDSIM_S3_BUCKET: redsim
      REDSIM_S3_ACCESS_KEY_ID: redsim
      REDSIM_S3_SECRET_ACCESS_KEY: redsim-secret
      REDSIM_CORS_ORIGINS: http://localhost:3300
      # Hygiene, not a fix: the socket handshake is already admitted through
      # REDSIM_CORS_ORIGINS above (redsim/api/ws.py accepts either). Declaring
      # it stops the API from also admitting the unused port 3000 default.
      REDSIM_WEB_ORIGIN: http://localhost:3300
      # Fernet key for AuthProfile secrets. Without it every create fails closed.
      REDSIM_AUTH_PROFILES_KEY: ${REDSIM_AUTH_PROFILES_KEY:-}
      REDSIM_OIDC_ISSUER: http://keycloak:8080/realms/redsim
      REDSIM_OIDC_JWKS_URL: http://keycloak:8080/realms/redsim/protocol/openid-connect/certs
      # The public half of the keypair redsim-web signs redsim_api_session
      # with. Without it the api verifies no browser cookie and answers 401
      # to every call the UI makes after a successful Keycloak login.
      REDSIM_API_SESSION_PUBLIC_KEY: ${REDSIM_API_SESSION_PUBLIC_KEY:-}
      # Pythia gateway passthrough (docs/ops/pythia.md). Empty when the host
      # shell does not export them, so the LLM narrative simply stays off.
      PYTHIA_BASE_URL: ${PYTHIA_BASE_URL:-}
      PYTHIA_API_KEY: ${PYTHIA_API_KEY:-}
      PYTHIA_PERSONA: ${PYTHIA_PERSONA:-}
      REDSIM_ML_LLM_MODEL: ${REDSIM_ML_LLM_MODEL:-}
      # Phase B admission caps the API enforces (.env.example documents each; empty keeps the default).
      REDSIM_ML_ENDPOINT_MAX_ROWS: ${REDSIM_ML_ENDPOINT_MAX_ROWS:-}
      REDSIM_ML_ENDPOINT_MAX_REQUESTS: ${REDSIM_ML_ENDPOINT_MAX_REQUESTS:-}
      REDSIM_LLM_PROBE_MAX_PROMPTS_PER_PROBE: ${REDSIM_LLM_PROBE_MAX_PROMPTS_PER_PROBE:-}
      REDSIM_LLM_PROBE_MAX_RUNS_PER_PROJECT_PER_DAY: ${REDSIM_LLM_PROBE_MAX_RUNS_PER_PROJECT_PER_DAY:-}
      REDSIM_LLM_PROBE_HF_DETECTORS: ${REDSIM_LLM_PROBE_HF_DETECTORS:-}
      REDSIM_ML_MAX_CONCURRENT_RUNS_PER_PROJECT: ${REDSIM_ML_MAX_CONCURRENT_RUNS_PER_PROJECT:-}
      REDSIM_ML_DAILY_RUN_BUDGET: ${REDSIM_ML_DAILY_RUN_BUDGET:-}
      REDSIM_ML_BATCH_MAX_MEMBERS: ${REDSIM_ML_BATCH_MAX_MEMBERS:-}
      REDSIM_ML_BULK_UPLOAD_MAX_FILES: ${REDSIM_ML_BULK_UPLOAD_MAX_FILES:-}
      REDSIM_ML_BULK_UPLOAD_MAX_MB: ${REDSIM_ML_BULK_UPLOAD_MAX_MB:-}
      REDSIM_ML_DATASET_UPLOAD_MAX_MB: ${REDSIM_ML_DATASET_UPLOAD_MAX_MB:-}
      REDSIM_ML_DATASET_MAX_ROWS: ${REDSIM_ML_DATASET_MAX_ROWS:-}
      # Foundry presence only (GET /v1/integrations reports disabled / misconfigured / configured);
      # the push itself runs on the default worker pool. No token: the bearer is an AuthProfile.
      REDSIM_INTEGRATION_FOUNDRY_URL: ${REDSIM_INTEGRATION_FOUNDRY_URL:-}
      REDSIM_INTEGRATION_FOUNDRY_NON_OPERATIONAL: ${REDSIM_INTEGRATION_FOUNDRY_NON_OPERATIONAL:-}
      REDSIM_INTEGRATION_FOUNDRY_DATASET_RID: ${REDSIM_INTEGRATION_FOUNDRY_DATASET_RID:-}
      REDSIM_INTEGRATION_FOUNDRY_TIMEOUT_S: ${REDSIM_INTEGRATION_FOUNDRY_TIMEOUT_S:-}
      # The Ed25519 key that signs evidence packs (GET /v1/runs/{id}/evidence-pack). Empty leaves packs unsigned.
      REDSIM_EVIDENCE_SIGNING_KEY_FILE: ${REDSIM_EVIDENCE_SIGNING_KEY_FILE:-}
      REDSIM_EVIDENCE_SIGNING_KEY: ${REDSIM_EVIDENCE_SIGNING_KEY:-}
      # The built asset tree (`redsim ml build-assets`): GET /v1/models and
      # /v1/datasets read MANIFEST.json here, and registering a bundled model
      # answers 409 bundled_assets_missing without it.
      REDSIM_ML_ASSETS_DIR: /app/assets
    ports: ["8000:8000"]
    # The repo's ./assets (README only until `redsim ml build-assets` has run)
    # mounted read-only at the path the API and the worker parent read as
    # REDSIM_ML_ASSETS_DIR; the sandbox child inherits the variable.
    # REDSIM_ML_ASSETS_HOST_DIR points the mount at a tree built elsewhere.
    volumes: &assets-volume
      - ${REDSIM_ML_ASSETS_HOST_DIR:-./../assets}:/app/assets:ro

  # Long-running attack, explain and model-validate work (-Q scans).
  redsim-worker:
    image: redsim-worker:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    command: ["celery", "-A", "redsim.workers.celery_app", "worker", "-Q", "scans", "--loglevel=info"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    volumes: *assets-volume
    environment: &worker-env
      REDSIM_ENV: dev
      REDSIM_ML_ASSETS_DIR: /app/assets
      REDSIM_WEB_ORIGIN: http://localhost:3300
      REDSIM_DB_URL: postgresql+psycopg://redsim:redsim@postgres:5432/redsim
      REDSIM_BROKER_URL: redis://redis:6379/0
      REDSIM_RESULT_BACKEND: redis://redis:6379/1
      REDSIM_BLOB_BACKEND: s3
      REDSIM_S3_ENDPOINT: http://minio:9000
      REDSIM_S3_BUCKET: redsim
      REDSIM_S3_ACCESS_KEY_ID: redsim
      REDSIM_S3_SECRET_ACCESS_KEY: redsim-secret
      # Rules-only by default so a stack with no gateway never stalls on one.
      # Export REDSIM_DISABLE_LLM=0 (or set it in .env beside the PYTHIA_*
      # names) to let the hardening narrative reach Pythia.
      # The worker resolves an AuthProfile secret at job pickup, so it needs the
      # same Fernet key the API encrypted it with. Empty fails closed, never anonymous.
      REDSIM_AUTH_PROFILES_KEY: ${REDSIM_AUTH_PROFILES_KEY:-}
      REDSIM_DISABLE_LLM: ${REDSIM_DISABLE_LLM:-1}
      # Sandbox child budget for a laptop QA run. The spec 20.3 defaults (900
      # CPU seconds, 2 threads, 1200 s wall clock) are sized for the CI
      # fixtures: a vehicles_cnn campaign with n_samples 50 reached the explain
      # stage at about 470 s of wall clock on two threads and was SIGKILLed by
      # the CPU rlimit. The wall clock stays below the Celery soft limit
      # (1800 s). Export any of the three to override.
      REDSIM_ML_SANDBOX_CPU_SECONDS: ${REDSIM_ML_SANDBOX_CPU_SECONDS:-3600}
      REDSIM_ML_SANDBOX_THREADS: ${REDSIM_ML_SANDBOX_THREADS:-4}
      REDSIM_ML_SANDBOX_TIMEOUT_S: ${REDSIM_ML_SANDBOX_TIMEOUT_S:-1700}
      # Pythia gateway passthrough (docs/ops/pythia.md). The worker also needs
      # REDSIM_DISABLE_LLM unset before the hardening narrative is produced.
      PYTHIA_BASE_URL: ${PYTHIA_BASE_URL:-}
      PYTHIA_API_KEY: ${PYTHIA_API_KEY:-}
      PYTHIA_PERSONA: ${PYTHIA_PERSONA:-}
      REDSIM_ML_LLM_MODEL: ${REDSIM_ML_LLM_MODEL:-}
      # Phase B worker-parent settings (.env.example documents each; empty keeps the default). The
      # sandbox child and the probe child receive none of them: the parent reads them and hands the
      # child the numbers it needs in the request file.
      REDSIM_ML_ENDPOINT_RPS: ${REDSIM_ML_ENDPOINT_RPS:-}
      REDSIM_ML_ENDPOINT_BATCH_ROWS: ${REDSIM_ML_ENDPOINT_BATCH_ROWS:-}
      REDSIM_ML_ENDPOINT_TIMEOUT_S: ${REDSIM_ML_ENDPOINT_TIMEOUT_S:-}
      REDSIM_ML_ENDPOINT_MAX_ROWS: ${REDSIM_ML_ENDPOINT_MAX_ROWS:-}
      REDSIM_ML_ENDPOINT_MAX_REQUESTS: ${REDSIM_ML_ENDPOINT_MAX_REQUESTS:-}
      REDSIM_LLM_PROBE_HF_DETECTORS: ${REDSIM_LLM_PROBE_HF_DETECTORS:-}
      REDSIM_LLM_PROBE_HF_CACHE: ${REDSIM_LLM_PROBE_HF_CACHE:-}
      REDSIM_LLM_PROBE_TIMEOUT_S: ${REDSIM_LLM_PROBE_TIMEOUT_S:-}
      REDSIM_LLM_PROBE_CPU_SECONDS: ${REDSIM_LLM_PROBE_CPU_SECONDS:-}
      REDSIM_LLM_PROBE_MEMORY_MB: ${REDSIM_LLM_PROBE_MEMORY_MB:-}
      REDSIM_LLM_PROBE_FILESIZE_MB: ${REDSIM_LLM_PROBE_FILESIZE_MB:-}
      REDSIM_LLM_PROBE_MAX_PROCESSES: ${REDSIM_LLM_PROBE_MAX_PROCESSES:-}
      REDSIM_ML_MAX_CONCURRENT_RUNS_PER_PROJECT: ${REDSIM_ML_MAX_CONCURRENT_RUNS_PER_PROJECT:-}
      REDSIM_ML_DAILY_RUN_BUDGET: ${REDSIM_ML_DAILY_RUN_BUDGET:-}
      REDSIM_ML_DATASET_MAX_ROWS: ${REDSIM_ML_DATASET_MAX_ROWS:-}

  # Fast bookkeeping (-Q default): report rendering, the stale-job reaper,
  # tenant reconciliation, WORM export and, since Phase B wave B3, the Foundry
  # push (redsim.integration_push): the only pool with outbound HTTPS egress, so
  # the REDSIM_INTEGRATION_FOUNDRY_* settings are scoped to this service and
  # the scans pool never carries them (INTEROP-29, BULK-23). Kept off the scans
  # pool so long scans can't starve it. Reuses the worker image + env via the
  # &worker-env anchor, extended with the Foundry settings.
  redsim-worker-default:
    image: redsim-worker:dev
    command: ["celery", "-A", "redsim.workers.celery_app", "worker", "-Q", "default", "--loglevel=info"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    volumes: *assets-volume
    environment:
      <<: *worker-env
      # Off unless the host shell exports the URL; no token variable exists (the bearer is an AuthProfile).
      REDSIM_INTEGRATION_FOUNDRY_URL: ${REDSIM_INTEGRATION_FOUNDRY_URL:-}
      REDSIM_INTEGRATION_FOUNDRY_NON_OPERATIONAL: ${REDSIM_INTEGRATION_FOUNDRY_NON_OPERATIONAL:-}
      REDSIM_INTEGRATION_FOUNDRY_DATASET_RID: ${REDSIM_INTEGRATION_FOUNDRY_DATASET_RID:-}
      REDSIM_INTEGRATION_FOUNDRY_TIMEOUT_S: ${REDSIM_INTEGRATION_FOUNDRY_TIMEOUT_S:-}

  # Beat scheduler: the only process that fires app.conf.beat_schedule (the
  # stale-job reaper, every 5 min). Without it the reaper never runs.
  redsim-beat:
    image: redsim-worker:dev
    command: ["celery", "-A", "redsim.workers.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis: { condition: service_healthy }
    environment: *worker-env

  redsim-web:
    image: redsim-web:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      # Baked into the browser bundle at build time (deploy/Dockerfile.web has
      # no default). Local stack: the API is published on the host at :8000.
      args:
        NEXT_PUBLIC_REDSIM_API_URL: http://localhost:8000
    # The long form is required for the Keycloak condition, and Compose does
    # not allow the short list beside it, so redsim-api is carried across
    # explicitly rather than dropped.
    depends_on:
      redsim-api: { condition: service_started }
      keycloak: { condition: service_healthy }
    # Host port :3300 avoids the macOS collision where another local dev
    # server commonly grabs :3000. Container-internal stays :3000 so the
    # Next.js process is unchanged.
    ports: ["3300:3000"]
    environment:
      # The browser reaches FastAPI directly for exactly three surfaces: the
      # run-events socket, artifact images and report downloads. Everything
      # else goes through the tRPC layer inside this container.
      NEXT_PUBLIC_REDSIM_API_URL: http://localhost:8000
      # Where the Next server itself reaches FastAPI. Container to container,
      # so the service name rather than the published port. A runtime
      # variable, not baked into the image.
      REDSIM_API_URL: http://redsim-api:8000
      # Browser-facing origin, so the published port rather than the service
      # name. The web secret seals the refresh cookie and must be at least 32
      # characters; this dev placeholder is not a secret and must be replaced
      # outside local dev.
      REDSIM_WEB_ORIGIN: http://localhost:3300
      REDSIM_WEB_SESSION_SECRET: dev-web-session-secret-change-me-32chars
      # The realm the login route exchanges the email and password with,
      # container to container. Tokens may carry either issuer spelling, so the
      # published-port one is listed too.
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/redsim
      KEYCLOAK_PUBLIC_ISSUER: http://localhost:8080/realms/redsim
      # The realm's redsim-web is a public client with direct access grants on,
      # so no client secret.
      KEYCLOAK_CLIENT_ID: redsim-web
      # Operator-supplied. No keypair is committed, so a stack without it
      # completes the login and mints no redsim cookies, and API calls 401.
      REDSIM_API_SESSION_PRIVATE_KEY: ${REDSIM_API_SESSION_PRIVATE_KEY:-}
      REDSIM_ENV: dev
      # The finding chat calls the Pythia gateway from the Next server with the
      # same names the Python services read. Empty leaves the chat unavailable.
      PYTHIA_BASE_URL: ${PYTHIA_BASE_URL:-}
      PYTHIA_API_KEY: ${PYTHIA_API_KEY:-}
      PYTHIA_PERSONA: ${PYTHIA_PERSONA:-}
      REDSIM_WEB_CHAT_MODEL: ${REDSIM_WEB_CHAT_MODEL:-}

  # ----- Always-on Postgres log mirror (F20c) ------------------------------
  # The redsim-log-ingest sidecar receives OTLP/Logs (under the obs profile)
  # and/or direct JSON batches from the API + worker (default profile) and
  # writes them to application_logs. SELECT * FROM application_logs WHERE
  # run_id='...' returns the full trace without needing Loki or
  # Elasticsearch up.
  redsim-log-ingest:
    image: redsim-log-ingest:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.log_ingest
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      REDSIM_DB_URL: postgresql+psycopg://redsim:redsim@postgres:5432/redsim
    ports: ["4319:4319"]

  # ----- policy profile: external OPA policy engine ------------------------
  # Opt-in (non-default) policy decision point for the role gate. Bring it
  # up with `docker compose --profile policy up opa`, mount the example
  # Rego, then run the API/worker with REDSIM_POLICY_ENGINE=opa and
  # REDSIM_OPA_URL=http://opa:8181. The default `docker compose up` is
  # unchanged — without the profile this service never starts.
  opa:
    image: openpolicyagent/opa:0.66.0
    profiles: ["policy"]
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./opa:/policies:ro
    ports:
      - "8181:8181"

  # ----- obs profile: Collector + Loki + Jaeger ----------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    profiles: ["obs"]
    depends_on:
      redsim-log-ingest: { condition: service_started }
      loki: { condition: service_started }
    volumes:
      - ./otel/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4320:4318"   # OTLP HTTP (4318 taken by Jaeger below; remap)

  loki:
    image: grafana/loki:2.9.7
    profiles: ["obs"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
    ports:
      - "3100:3100"

  jaeger:
    image: jaegertracing/all-in-one:1.55
    profiles: ["obs"]
    ports:
      - "16686:16686"
      - "4318:4318"

  # ----- obs-search profile: Elasticsearch + Kibana ------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    profiles: ["obs-search"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    profiles: ["obs-search"]
    depends_on: [elasticsearch]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

volumes:
  postgres-data:
  minio-data:
