# redsim on one EC2 host, deployed from source (deploy/ec2/README.md).
#
# Python services run the ECR base images (dependencies) with the host
# checkout's ``redsim/`` package bind-mounted over the installed one, so a
# ``git pull`` plus a container restart deploys a change in seconds. The web
# app runs the Next.js dev server on the mounted checkout for the same
# reason. ``redsim-deploy`` drives it; ``redsim-deploy --build`` rebuilds the
# Python images from the Dockerfiles when dependencies change.
#
# Paths come from the environment the deploy script exports:
#   REDSIM_HOST_DIR   /opt/redsim (env files, assets, caddy)
#   REDSIM_SRC_DIR    /opt/redsim/src (the git checkout)
#   REDSIM_BASE_TAG   ECR tag of the dependency images (a main sha)
#   REDSIM_REGISTRY   <account>.dkr.ecr.<region>.amazonaws.com/ndia-red-team
name: redsim
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ${REDSIM_HOST_DIR}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, web, identity]
  identity:
    build:
      context: ${REDSIM_SRC_DIR}
      dockerfile: deploy/Dockerfile.identity
    image: redsim-host/identity
    restart: unless-stopped
    command: ["start", "--import-realm"]
    env_file:
      - ${REDSIM_HOST_DIR}/env/identity.env
      - ${REDSIM_HOST_DIR}/env/identity.secret.env
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /auth/realms/redsim HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \" 200 \" <&3'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
  api:
    image: ${REDSIM_REGISTRY}/api:${REDSIM_BASE_TAG}
    restart: unless-stopped
    command: ["uvicorn", "redsim.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    env_file:
      - ${REDSIM_HOST_DIR}/env/common.env
      # The LLM flags (REDSIM_DISABLE_LLM, REDSIM_TARGET_ALLOWLIST) and the Pythia
      # variables are rendered by redsim-render-env; the api needs them for the
      # gateway model picker, the LLM capability flags and LLM target registration.
      - path: ${REDSIM_HOST_DIR}/env/llm.env
        required: false
      - path: ${REDSIM_HOST_DIR}/env/pythia.env
        required: false
      - ${REDSIM_HOST_DIR}/env/api.secret.env
    volumes:
      - ${REDSIM_SRC_DIR}/redsim:/app/redsim:ro
      - ${REDSIM_SRC_DIR}/alembic.ini:/app/alembic.ini:ro
      - ${REDSIM_HOST_DIR}/assets:/app/assets:ro
    depends_on:
      identity: { condition: service_healthy }
  web:
    # Dev server on the checkout: no build step, changes apply on reload.
    image: node:20-bookworm
    restart: unless-stopped
    working_dir: /repo
    command: ["bash", "-lc", "corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile && pnpm --filter @redsim/web dev -p 3000 -H 0.0.0.0"]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_REDSIM_API_URL: ${REDSIM_PUBLIC_ORIGIN}
    env_file:
      - ${REDSIM_HOST_DIR}/env/web.env
      - ${REDSIM_HOST_DIR}/env/web.secret.env
    volumes:
      - ${REDSIM_SRC_DIR}:/repo
      - pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      identity: { condition: service_healthy }
      api: { condition: service_started }
  scans:
    image: ${REDSIM_REGISTRY}/worker:${REDSIM_BASE_TAG}
    restart: unless-stopped
    command: ["celery", "-A", "redsim.workers.celery_app", "worker", "-Q", "scans", "--concurrency=1", "--loglevel=info"]
    env_file:
      - ${REDSIM_HOST_DIR}/env/common.env
      - path: ${REDSIM_HOST_DIR}/env/llm.env
        required: false
      - ${REDSIM_HOST_DIR}/env/pythia.env
      - ${REDSIM_HOST_DIR}/env/scans.secret.env
    volumes:
      - ${REDSIM_SRC_DIR}/redsim:/app/redsim:ro
      - ${REDSIM_HOST_DIR}/assets:/app/assets:ro
  default:
    image: ${REDSIM_REGISTRY}/worker:${REDSIM_BASE_TAG}
    restart: unless-stopped
    command: ["celery", "-A", "redsim.workers.celery_app", "worker", "-Q", "default", "--concurrency=1", "--loglevel=info"]
    env_file:
      - ${REDSIM_HOST_DIR}/env/common.env
      - path: ${REDSIM_HOST_DIR}/env/llm.env
        required: false
      - ${REDSIM_HOST_DIR}/env/pythia.env
      - ${REDSIM_HOST_DIR}/env/default.secret.env
    volumes:
      - ${REDSIM_SRC_DIR}/redsim:/app/redsim:ro
      - ${REDSIM_HOST_DIR}/assets:/app/assets:ro
  beat:
    image: ${REDSIM_REGISTRY}/worker:${REDSIM_BASE_TAG}
    restart: unless-stopped
    command: ["celery", "-A", "redsim.workers.celery_app", "beat", "--schedule=/tmp/celerybeat-schedule", "--loglevel=info"]
    env_file:
      - ${REDSIM_HOST_DIR}/env/common.env
      - path: ${REDSIM_HOST_DIR}/env/llm.env
        required: false
      - ${REDSIM_HOST_DIR}/env/beat.secret.env
    volumes:
      - ${REDSIM_SRC_DIR}/redsim:/app/redsim:ro
volumes:
  caddy-data: {}
  caddy-config: {}
  pnpm-store: {}
