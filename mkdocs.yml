# MkDocs config for the Redsim docs site.
#
# Authoring stays in markdown under docs/. This config renders the
# same markdown into a browseable site (search, sidebar, dark mode,
# native mermaid). Build locally:
#
#   pip install -e ".[docs]"
#   mkdocs serve          # http://localhost:8001
#   mkdocs build          # output: ./site
#
# CI builds on every PR (mkdocs build --strict). GitHub Pages publishing is
# off: see .github/workflows/docs.yml.

site_name: Redsim
site_description: >-
  Redsim adversarial-ML red-team simulator: attack, measure, explain,
  recommend. With a hash-chained audit log so what the platform did,
  against what target, on whose authority, always has a verifiable answer.
site_url: https://redsim-docs.example.com
repo_name: redsim
repo_url: https://github.com/IntelliBridge/ndia-red-team-simulator
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# Use port 8001 by default so it doesn't collide with FastAPI on 8000.
dev_addr: 127.0.0.1:8001

# ---------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # Top-level tabs for the major sections.
    - navigation.tabs
    - navigation.tabs.sticky
    # Group nav into sections in the sidebar.
    - navigation.sections
    # Expanded by default so users see structure at a glance.
    - navigation.expand
    # Show breadcrumb path for the current page.
    - navigation.path
    # Section landings link to a directory's index.md.
    - navigation.indexes
    # "Back to top" button.
    - navigation.top
    # Search with suggestions + highlighting.
    - search.suggest
    - search.highlight
    - search.share
    # Code blocks: copy button + line annotations.
    - content.code.copy
    - content.code.annotate
    # Linked tabs (kept in sync across pages).
    - content.tabs.link
    # "Edit this page" link via edit_uri.
    - content.action.edit
    # Follow-as-you-scroll TOC.
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# ---------------------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------------------

markdown_extensions:
  # Standard Material set.
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

  # PyMdown extras, bundled with mkdocs-material.
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets:
      # Allow snippets to pull from repo root (for CHANGELOG etc.).
      base_path: ["docs", "."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        # Native mermaid rendering: the markdown we already wrote
        # (```mermaid blocks) renders without any rewrite.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols

# ---------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------

plugins:
  - search

# ---------------------------------------------------------------------
# Build hooks
# ---------------------------------------------------------------------
#
# readme_as_index.py reads ../README.md at build time and rewrites
# its docs/X.md paths so the README renders cleanly as docs/index.md.
# Single source of truth: README.md at the repo root.
#
# cross_tree_links.py rewrites relative links that escape docs/ (for
# example ../specs/README.md from project-brief.md) to absolute GitHub
# URLs when the target exists in the repo, so `mkdocs build --strict`
# stays green without duplicating the Spec Kit tree into the site.
# Links to files that exist nowhere are left alone and still fail strict.

hooks:
  - hooks/readme_as_index.py
  - hooks/cross_tree_links.py

# `mkdocs serve` watches docs_dir + mkdocs.yml by default; tell it to
# also rebuild when the README (rendered as index.md via the hook) or
# the hook itself changes.
watch:
  - README.md
  - hooks/

# ---------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------
#
# CHANGELOG / CONTRIBUTING / SECURITY live at the repo root (GitHub
# conventions) and aren't duplicated here. The nav points at the
# GitHub-hosted copy via a full URL; mkdocs renders external URLs
# as plain nav entries.

nav:
  - Home: index.md
  - Product and planning:
      - Project brief: project-brief.md
      - Product spec (2026-09-08): superpowers/specs/2026-09-08-adversarial-ml-redteam-spec.md
      - Master plan: plans/00-master-plan.md
      - Phase plans:
          - "P0 Contracts + API skeleton": plans/01-p0-contracts-api-skeleton.md
          - "P1 Targets + assets": plans/02-p1-targets-assets.md
          - "P2 Attacks + scoring": plans/03-p2-attacks-scoring.md
          - "P3 Explain, recommend, ATLAS": plans/04-p3-explain-recommend-atlas.md
          - "P4 Orchestration + API": plans/05-p4-orchestration-api.md
          - "P5 Web UI": plans/06-p5-web-ui.md
          - "P6 Interoperability": plans/07-p6-interoperability.md
          - "P7 Infra + CD": plans/08-p7-infra-cd.md
          - Execution context: plans/EXECUTION-CONTEXT.md
      - "Gap register (2026-09-08)": plans/09-gap-register-2026-09-08.md
      - Phase B:
          - "Remaining-work brief": plans/10-remaining-work-brief.md
          - "Phase B register (2026-09-09)": plans/11-phase-b-register-2026-09-09.md
          - "Phase B plan": plans/12-phase-b-plan.md
      - Workstreams:
          - ML core: workstreams/ml-core.md
          - ML assets: workstreams/ml-assets.md
          - Pythia access: workstreams/pythia-access.md
      - Team backlog: team-backlog.md
      - Spec-driven workflow: spec-driven-workflow.md
      - Audit foundation contract: audit-foundation-contract.md
      - Superseded:
          - "Hackathon spec (v1)": adversarial-ml-redteam-spec.md
          - "Redsim design note": superpowers/specs/2026-09-08-redsim-design.md
  - Architecture:
      - Overview: architecture/overview.md
      - Auth: architecture/auth.md
      - Audit chain: architecture/audit-chain.md
      - Multi-tenancy: architecture/multi-tenancy.md
      - Observability: architecture/observability.md
      - ML vertical: architecture/ml-vertical.md
      - "Interoperability (Croissant, ATLAS, Foundry)": interop.md
      - Diagrams: architecture/diagrams/README.md
  - API reference:
      - "HTTP API (/v1)": api/v1.md
      - "Endpoint predict contract (endpoint-v1)": api/endpoint-contract.md
  - Operations:
      - Production deployment: ops/deploy.md
      - Kubernetes (Helm): ops/kubernetes.md
      - Pythia (LLM gateway): ops/pythia.md
      - Compliance evidence pack: ops/compliance-evidence.md
  - Development:
      - Local stack: dev/local-stack.md
      - Testing: dev/testing.md
      - Frontend: dev/frontend.md
      - Extending Redsim: dev/extending.md
      - CI pipeline: dev/ci.md
      - Editing the docs: dev/docs.md
  - Security:
      - Supply-chain integrity: security/supply-chain.md
      - "Policy (SECURITY.md)": https://github.com/IntelliBridge/ndia-red-team-simulator/blob/main/SECURITY.md
  - ADRs:
      - "0001 Vendored submodules": adr/0001-vendored-submodules.md
      - "0002 Registry seam + runners": adr/0002-registry-seam-and-runners.md
      - "0004 Unified effect-class gate": adr/0004-unified-effect-class-gate.md
      - "0005 Worker autoscaling + DR": adr/0005-worker-autoscaling-and-dr.md
      - "0008 Nix reproducible builds": adr/0008-nix-reproducible-builds.md
  - "Changelog ↗": https://github.com/IntelliBridge/ndia-red-team-simulator/blob/main/CHANGELOG.md
  - "Contributing ↗": https://github.com/IntelliBridge/ndia-red-team-simulator/blob/main/CONTRIBUTING.md

# ---------------------------------------------------------------------
# Strictness: fail the build on broken refs so CI catches them.
# ---------------------------------------------------------------------

# In CI we run with `--strict` (see .github/workflows/docs.yml) which
# elevates these warnings to errors.
strict: false

# ---------------------------------------------------------------------
# Extra footer / metadata
# ---------------------------------------------------------------------

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/IntelliBridge/ndia-red-team-simulator
copyright: >-
  Redsim is Apache-2.0. Bundled components keep their own licenses.
