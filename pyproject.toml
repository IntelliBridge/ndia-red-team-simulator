[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-platform"
version = "0.2.0"
description = "Aegis MVP glue code for security finding normalization and remediation orchestration."
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "responses>=0.25",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]  # isort
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
