[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-platform"
version = "0.13.0"
description = "Aegis platform + adversarial-ML red-team vertical: ART attacks, SHAP evidence, hardening recommendations."
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "moto>=5.0",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
]
security = [
    # Self-scanning toolchain for the `sast`/`deps` CI jobs (cluster C2).
    # bandit -> Python AST security linter; pip-audit -> dependency CVE
    # audit against the resolved env; semgrep -> rule-based SAST
    # (p/python + p/security-audit). trivy is installed in CI from its
    # upstream release, not pip, so it is intentionally absent here.
    "bandit>=1.7",
    "pip-audit>=2.7",
    "semgrep>=1.60",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "authlib>=1.3",
    "httpx>=0.27",
    "cryptography>=42",
    "dnspython>=2.6",
    "boto3>=1.34",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
]
worker = [
    "celery[redis]>=5.3",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    "structlog>=24.1",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]
ml = [
    # Adversarial-ML vertical (worker image only; keep API/web images small).
    "numpy>=1.26,<3",
    "torch>=2.3",
    "torchvision>=0.18",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "scikit-learn>=1.4",
    "adversarial-robustness-toolbox>=1.18",
    "shap>=0.46",
    "matplotlib>=3.8",
    "pillow>=10",
    "pyarrow>=15",
    "datasets>=2.20",
    "httpx>=0.27",
]
llm = [
    # Optional: the official Pythia SDK (private IntelliBridge repo). aegis.llm.pythia
    # falls back to an in-repo httpx client speaking the same OpenAI-compatible contract.
    "pythia-sdk @ git+https://github.com/IntelliBridge/pythia.git#subdirectory=packages/pythia-sdk-python",
]
garak = ["garak>=0.9"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Phase 4 v0.3.1 markers. The default invocation (no -m flag) runs the
# unit + integration tests; docker/e2e/slow/auth_required are opt-in.
markers = [
    "ml: needs the ml extra (torch/ART/SHAP); skipped when absent",
    "unit: pure-Python unit test (default)",
    "integration: integration test that may hit Postgres/Redis but not Docker",
    "docker: needs Docker; gated in CI behind workflow_dispatch",
    "e2e: end-to-end against a live stack; gated by AEGIS_E2E env",
    "slow: long-running test; excluded by default",
    "auth_required: needs Keycloak/cookie flow; lands in v0.4.0",
]
addopts = "-m 'not docker and not e2e and not slow and not auth_required'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]  # isort
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
