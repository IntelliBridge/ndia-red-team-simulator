[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redsim-platform"
version = "0.13.0"
description = "Redsim platform + adversarial-ML red-team vertical: ART attacks, SHAP evidence, hardening recommendations."
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "moto>=5.0",
    # Text extraction from the campaign report PDF (redsim/ml/pdf.py) in tests.
    "pypdf>=4",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
]
security = [
    # Self-scanning toolchain for the `sast`/`deps` CI jobs (cluster C2).
    # bandit -> Python AST security linter; pip-audit -> dependency CVE
    # audit against the resolved env; semgrep -> rule-based SAST
    # (p/python + p/security-audit). trivy is installed in CI from its
    # upstream release, not pip, so it is intentionally absent here.
    "bandit>=1.7",
    "pip-audit>=2.7",
    "semgrep>=1.60",
]
api = [
    "fastapi>=0.110",
    # Starlette's multipart/form-data parser. POST /v1/models with
    # source="upload" (redsim/api/v1/models.py) reads the upload as a form;
    # without this the route fails with "The `python-multipart` library must
    # be installed to use form parsing" (Coverage gate on main at bb43bd7).
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "authlib>=1.3",
    "httpx>=0.27",
    "cryptography>=42",
    "dnspython>=2.6",
    "boto3>=1.34",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    # numpy is metadata-only for the API: the catalog registries (redsim.ml.attacks/defenses/targets) import it at module level; torch/ART/onnxruntime/shap/sklearn stay in ml.
    "numpy>=1.26,<3",
]
worker = [
    "celery[redis]>=5.3",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    "structlog>=24.1",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    # Phase B report.pdf (spec 14.8, 17.4; REVIEW_REPORTS-15): pure-Python PDF
    # renderer with the DejaVu faces bundled under redsim/ml/pdf_fonts/, imported by
    # redsim.ml.pdf on the worker's report.render path only. Declared here once: the
    # worker image installs .[worker,ml] and every CI lane installs the worker extra;
    # the offline CLI (redsim ml attack) writes the three text formats and needs no
    # PDF renderer. The API process never imports it (tests/test_api_process_has_no_ml.py).
    "reportlab>=4.2",
    "pillow>=10",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]
ml = [
    # Adversarial-ML vertical (worker image only; keep API/web images small).
    "numpy>=1.26,<3",
    "torch>=2.3",
    "torchvision>=0.18",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "scikit-learn>=1.4",
    "adversarial-robustness-toolbox>=1.18",
    # ONNX -> torch.nn.Module for gradient attacks on uploaded ONNX models,
    # and the pickle-free state_dict format (spec sections 8.4, 9.2).
    "onnx2torch>=1.5",
    "safetensors>=0.4",
    "shap>=0.46",
    "matplotlib>=3.8",
    "pillow>=10",
    "pyarrow>=15",
    "httpx>=0.27",
]
llm = [
    # Optional: the official Pythia SDK (private IntelliBridge repo). redsim.llm.pythia
    # falls back to an in-repo httpx client speaking the same OpenAI-compatible contract.
    "pythia-sdk @ git+https://github.com/IntelliBridge/pythia.git#subdirectory=packages/pythia-sdk-python",
]
garak = [
    # Phase B LLM probing (spec 11.6, plan 12). Worker default pool only, never the
    # API image. Pinned to the 0.16 line: the runner drives garak through --config
    # YAML (the --model_type/--probes flags are deprecated in 0.16) and points its
    # OpenAI-compatible generator at Pythia. garak installs litellm, openai and
    # other provider clients; none is configured or imported by redsim
    # (tests/test_api_process_has_no_ml.py). CI lane: "garak offline" (docs/dev/ci.md).
    "garak>=0.16,<0.17",
]

[project.scripts]
redsim = "redsim.cli:main"

[tool.setuptools.packages.find]
include = ["redsim*"]

[tool.setuptools.package-data]
# The subset DejaVu faces and their licence the PDF renderer registers (redsim/ml/pdf.py).
"redsim.ml.pdf_fonts" = ["*.ttf", "LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Phase 4 v0.3.1 markers plus the Phase B ``garak`` marker. The default
# invocation (no -m flag) runs the unit + integration tests;
# docker/e2e/slow/auth_required/garak are opt-in (a CLI -m overrides addopts,
# so the CI lanes restate these exclusions in their own marker expressions).
markers = [
    "ml: needs the ml extra (torch/ART/SHAP); skipped when absent",
    "unit: pure-Python unit test (default)",
    "integration: integration test that may hit Postgres/Redis but not Docker",
    "docker: needs Docker; gated in CI behind workflow_dispatch",
    "e2e: end-to-end against a live stack; gated by REDSIM_E2E env",
    "slow: long-running test; excluded by default",
    "auth_required: needs Keycloak/cookie flow; lands in v0.4.0",
    "garak: needs the garak extra; skipped when absent",
]
addopts = "-m 'not docker and not e2e and not slow and not auth_required and not garak'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]  # isort
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# ml-tier test modules import the code under test after pytest.importorskip so
# they skip cleanly without the ml extra (E402 is enabled by CI's --select E4).
"tests/ml/test_assets_manifest.py" = ["E402"]
"tests/ml/test_fixture_sample.py" = ["E402"]
"tests/ml/test_url_classifier_training.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI resolves these at request time, so a call in a default is the
# documented idiom, not a shared mutable default (B008).
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Body", "fastapi.Query", "fastapi.Path",
    "fastapi.Header", "fastapi.Cookie", "fastapi.Form", "fastapi.File",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
