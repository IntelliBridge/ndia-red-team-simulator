[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-platform"
version = "0.12.0"
description = "Aegis MVP glue code for security finding normalization and remediation orchestration."
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "authlib>=1.3",
    "httpx>=0.27",
    "cryptography>=42",
    "boto3>=1.34",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
]
worker = [
    "celery[redis]>=5.3",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    "structlog>=24.1",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Phase 4 v0.3.1 markers. The default invocation (no -m flag) runs the
# unit + integration tests; docker/e2e/slow/auth_required are opt-in.
markers = [
    "unit: pure-Python unit test (default)",
    "integration: integration test that may hit Postgres/Redis but not Docker",
    "docker: needs Docker; gated in CI behind workflow_dispatch",
    "e2e: end-to-end against a live stack; gated by AEGIS_E2E env",
    "slow: long-running test; excluded by default",
    "auth_required: needs Keycloak/cookie flow; lands in v0.4.0",
]
addopts = "-m 'not docker and not e2e and not slow and not auth_required'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]  # isort
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
