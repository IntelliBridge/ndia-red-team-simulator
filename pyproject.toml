[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redsim"
version = "0.1.0"
description = "Adversarial ML evaluation simulator: ART attacks, SHAP evidence, candidate hardening recommendations. Non-operational proof of concept."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "numpy>=1.26,<3",
    "torch>=2.3",
    "torchvision>=0.18",
    "adversarial-robustness-toolbox>=1.18",
    "shap>=0.46",
    "matplotlib>=3.8",
    "pillow>=10",
    "pyarrow>=15",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["litellm>=1.40"]
garak = ["garak>=0.9"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
redsim = "redsim.cli:main"

[tool.setuptools.packages.find]
include = ["redsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
